<!DOCTYPE html>
<!-- Marylebone Roster — the old address of the Link Designer, kept so a bookmark still lands (v27.09).

     v27.09 renamed the Links page to the Link Designer, and links.html to link-designer.html (owner,
     27 Nov 2026: "Links" was easily confused with the New link page, and the page is a design tool).
     firebase.json 301s the old address on the canonical origin; the GitHub Pages mirror serves no
     redirects, so the redirect is also written here, exactly as guide.html and fip.html do
     (.claude/rules/guide-pages.md; REDIRECT_PAGES in scripts/app-pages.mjs): one shared script,
     legacy-redirect.js, which keeps the ?query and #fragment, and a meta refresh as the no-script
     fallback. It goes when the mirror is retired, with its Firebase redirect.
-->
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
    <!-- CSP mirrors the firebase.json header so the GitHub Pages mirror (which cannot serve HTTP headers) gets the same policy, and the CSP travels with the HTML through the SW cache. GENERATED: edit the header in firebase.json and run npm run generate:copies, never this line. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/ https://cdn.jsdelivr.net/npm/mammoth@1.13.0/; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://firebasestorage.googleapis.com https://europe-west2-myb-roster.cloudfunctions.net https://garethdavidmiller.github.io; img-src 'self' data: https://firebasestorage.googleapis.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
    <!-- Staff-only app: nothing here has a public audience. Mirrors the X-Robots-Tag header in
         firebase.json, and is the ONLY noindex signal the GitHub Pages mirror gets (it cannot serve
         headers). Rationale in robots.txt; enforced by sw-asset-check.test.mjs. -->
    <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0; url=./link-designer.html">
  <link rel="canonical" href="./link-designer.html">
  <script src="./legacy-redirect.js"></script>
  <title>Link Designer — moved</title>
  <style>
    /* The brand navy and gold (.claude/rules/css-tokens.md → Brand colours) and the app's font stack, held to
       both by guide-colour-parity.test.mjs. No @font-face: the page shows for an instant. */
    body { margin: 0; padding: 2rem; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
           background: #001e3c; color: #fff; }
    a    { color: #f5c800; }
  </style>
</head>
<body>
  <p>Links is now the Link Designer, at <a href="./link-designer.html">link-designer.html</a>.</p>
</body>
</html>
