<!DOCTYPE html>
<!-- MYB Roster — Settings v14.64 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#001e3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MYB Settings">
  <title>MYB Roster — Settings</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="./shared.css">
  <link rel="stylesheet" href="./settings.css">
</head>
<body>

<!-- Login overlay is injected by login-overlay.js (shared in-place sign-in) when not signed in. -->

<!-- Tips lightbox -->
<div id="tipsLightbox" class="lb-overlay" role="dialog" aria-label="Tips" aria-modal="true">
    <div id="tipsLightboxContent" class="lb-content">
    <button id="tipsLightboxClose" class="lb-close" type="button" aria-label="Close">✕</button>
        <div class="tips-lb-title" id="tipsLbTitle"></div>
        <div id="tipsLbBody"></div>
    </div>
</div>

<!-- Icon lightbox -->
<div id="iconLightbox" class="lb-overlay" role="dialog" aria-label="About MYB Roster" aria-modal="true">
    <div id="iconLightboxContent" class="lb-content">
    <button id="iconLightboxClose" class="lb-close" type="button" aria-label="Close">✕</button>
        <img src="icon-192.png" id="lightboxAppIcon" alt="Chiltern Railways app icon">
        <div class="lightbox-app-name">Marylebone Roster</div>
        <div class="lightbox-version">Version <span id="lightboxVersion"></span></div>
        <div id="lightboxUpdateStatus" class="lightbox-status"></div>
        <div class="lightbox-badge">Settings</div>
        <a href="./index.html" class="lightbox-bug-link">📅 View staff roster</a>
        <a id="bugReportLink" class="lightbox-bug-link" href="#">🐛 Report a bug</a>
    </div>
</div>

<!-- Header -->
<header class="app-header">
    <button type="button" class="btn-burger" id="navMenuBtn"
            aria-label="Open navigation menu" aria-expanded="false">☰</button>
    <div class="app-header-brand">
        <img src="icon-192.png" class="app-icon" id="appIcon" alt="Chiltern Railways" loading="eager">
        <h1>Marylebone Roster</h1>
    </div>
    <span class="badge-page" id="settingsBadge"><span class="badge-glyph" aria-hidden="true">⚙</span> Settings</span>
</header>

<main class="app">

    <!-- Work Email -->
    <div class="card" id="contactCard">
        <div class="card-header card-collapsible-header" id="contactToggleHeader">
            <h2><span aria-hidden="true">📧</span> Work Email <button type="button" class="btn-card-tips" data-card="work-email" aria-label="Tips for work email" title="Tips for work email">?</button></h2>
            <span class="hint">Add your work email now — it will be used for password reset when that feature is added</span>
            <span class="collapse-chevron" id="contactChevron">▾</span>
        </div>
        <div class="card-collapsible-body" id="contactBody">
            <div class="card-body">
                <label class="contact-label" for="workEmailInput">Work email address</label>
                <input type="email" id="workEmailInput" class="contact-email-input"
                       inputmode="email"
                       autocomplete="email" autocapitalize="off" autocorrect="off"
                       spellcheck="false" placeholder="firstname.surname"
                       enterkeyhint="done">
                <button type="button" class="btn-action btn-primary" id="workEmailSaveBtn">Save email</button>
                <button type="button" class="btn-contact-remove" id="workEmailRemoveBtn" style="display:none">Remove saved email</button>
                <div class="contact-feedback" id="contactFeedback" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <!-- Push notifications -->
    <div class="card" id="notificationsCard">
        <div class="card-header card-collapsible-header" id="notifToggleHeader">
            <h2><span aria-hidden="true">🔔</span> Notifications <button type="button" class="btn-card-tips" data-card="notifications" aria-label="Tips for notifications" title="Tips for notifications">?</button></h2>
            <span class="hint">Get an alert when the daily Huddle is ready or payday is approaching</span>
            <span class="collapse-chevron" id="notifChevron">▾</span>
        </div>
        <div class="card-collapsible-body" id="notifBody">
            <div class="card-body">
                <div id="notifStatusMsg" aria-live="polite"></div>
                <button type="button" class="btn-action btn-primary" id="notifEnableBtn" style="display:none">Enable notifications</button>
                <button type="button" class="btn-action btn-secondary" id="notifDisableBtn" style="display:none">Disable notifications</button>
                <p id="notifDeniedMsg"></p>
            </div>
        </div>
    </div>

</main>

<script type="module" src="./settings-app.js"></script>
</body>
</html>
