name: Workflow Lint

# Why this exists (KNOWN_LIMITATIONS / external review L2):
# The Tests workflow (e2e.yml) and the three deploy workflows all PATH-FILTER their
# push triggers — e2e.yml `paths-ignore: .github/**`, the deploy workflows only fire
# on their own code paths. That is deliberate (a CI/doc-only edit shouldn't spin up
# the full unit + Playwright suite). But it left a blind spot: a push that touches
# ONLY workflow files got NO CI feedback on a branch, so a malformed workflow YAML
# (bad indentation, a missing `jobs:` key, a broken `on:` block) could merge unnoticed
# and only fail the NEXT time it was supposed to run — i.e. at deploy time.
#
# This job closes that gap with the minimum possible surface: it runs ONLY when a
# workflow file changes, and validates every workflow file. It uses the runner's Python
# with an EXPLICITLY PINNED PyYAML (see the install step) rather than a third-party
# action or a `curl | bash` installer, keeping to this repo's "pin/self-contained, no
# remote scripts" rule. It relied on PyYAML being preinstalled until v19.13 — present
# today, but not a documented guarantee of a moving runner image.
#
# COMPOSITE ACTIONS ARE VALIDATED TOO (added with the first one, Aug 2026). `.github/actions/**`
# was outside both the trigger and the glob, so an action's YAML was never parsed by anything — and
# the very first one written had a real error in it: an unquoted `description:` containing the text
# `issues: write`, whose `: ` YAML reads as a nested mapping. Same shape as every other
# hand-maintained list in this repo that stopped covering what arrived after it. An action gets its
# OWN structural checks, not the workflow ones — it has `runs:`, not `on:`/`jobs:` — plus the check
# that catches the classic composite mistake: a `run:` step with no `shell:`, which GitHub rejects
# only at call time, i.e. in the middle of whatever the action was supposed to be reporting on.
#
# It also enforces `timeout-minutes` on every job (added Jul 2026). No job had one, so each
# inherited GitHub's 6-HOUR default — a hung runner would have blocked the branch for
# the rest of the day, and on a required check nothing else could merge either. The
# rule lives HERE rather than in the nine workflow files because the failure mode is
# a job someone ADDS later without one; a hand-edit fixes today, a lint fixes always.

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # PyYAML is NOT a documented guarantee of the ubuntu-latest image — it is present today,
      # probably transitively via another preinstalled tool, and `ubuntu-latest` follows a moving
      # image. Depending on that implementation detail means a runner refresh could fail this job
      # BEFORE it validates anything, which is a confusing way for a workflow-only change to break.
      # Installing it explicitly (pinned) is a couple of seconds and removes the coupling. Still no
      # third-party action and no `curl | bash` — the repo's "pin / self-contained" rule holds.
      - name: Install the YAML parser (pinned — do not rely on the runner image)
        run: python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import sys, glob
          try:
              import yaml
          except ModuleNotFoundError:
              # Belt and braces: say WHAT is missing rather than emitting a bare import traceback,
              # so the failure names its own fix instead of looking like a broken workflow file.
              print('::error::PyYAML is not installed — the "Install the YAML parser" step above '
                    'should have provided it. Workflow YAML was NOT validated.')
              sys.exit(1)

          any_failed = False
          workflows = sorted(glob.glob('.github/workflows/*.yml') +
                             glob.glob('.github/workflows/*.yaml'))
          actions   = sorted(glob.glob('.github/actions/*/action.yml') +
                             glob.glob('.github/actions/*/action.yaml'))
          if not workflows:
              # A glob that matches nothing passes vacuously, which is the one way this job could
              # report success while validating no files at all.
              print('::error::no workflow files matched — the glob is wrong, nothing was validated')
              sys.exit(1)

          for path in workflows + actions:
              is_action = path.startswith('.github/actions/')
              errors = []
              try:
                  with open(path) as f:
                      doc = yaml.safe_load(f)
              except yaml.YAMLError as e:
                  print(f'::error file={path}::YAML parse error: {e}')
                  any_failed = True
                  continue

              if not isinstance(doc, dict):
                  print(f'::error file={path}::top level is not a mapping')
                  any_failed = True
                  continue

              if is_action:
                  runs = doc.get('runs')
                  if not isinstance(runs, dict):
                      errors.append('missing or malformed `runs:` block')
                  else:
                      if not runs.get('using'):
                          errors.append('`runs:` has no `using:`')
                      if runs.get('using') == 'composite':
                          steps = runs.get('steps')
                          if not isinstance(steps, list) or not steps:
                              errors.append('a composite action needs a non-empty `runs.steps:`')
                          else:
                              for i, st in enumerate(steps):
                                  # GitHub rejects a composite `run:` step with no `shell:` — but
                                  # only when the action is CALLED, which for this one means in the
                                  # middle of reporting a deploy failure.
                                  if isinstance(st, dict) and 'run' in st and not st.get('shell'):
                                      errors.append(f'composite step {i} has `run:` but no `shell:`')
                  if errors:
                      any_failed = True
                      for msg in errors:
                          print(f'::error file={path}::{msg}')
                  else:
                      print(f'ok: {path}')
                  continue

              # PyYAML parses the bare `on:` key as Python boolean True (YAML 1.1),
              # so accept either spelling.
              if 'on' not in doc and True not in doc:
                  errors.append('missing `on:` trigger block')
              if 'jobs' not in doc or not isinstance(doc.get('jobs'), dict) or not doc['jobs']:
                  errors.append('missing or empty `jobs:` block')

              # Every job must declare `timeout-minutes`. Without one a job inherits GitHub's
              # 6-hour default, so a hung runner blocks the branch for the rest of the day
              # instead of failing fast — and on a required check that means nothing else can
              # merge either. These are "this is stuck" thresholds (~3-13x observed runtime),
              # NOT performance budgets: raise the number if a job legitimately grows, don't
              # delete the key.
              for job_name, job in (doc.get('jobs') or {}).items():
                  if not isinstance(job, dict):
                      continue
                  if 'uses' in job:      # a reusable-workflow call sets its timeout downstream
                      continue
                  t = job.get('timeout-minutes')
                  if t is None:
                      errors.append(f'job `{job_name}` has no `timeout-minutes:`')
                  elif not isinstance(t, int) or t <= 0:
                      errors.append(f'job `{job_name}` has a non-positive `timeout-minutes: {t!r}`')

              if errors:
                  any_failed = True
                  for msg in errors:
                      print(f'::error file={path}::{msg}')
              else:
                  print(f'ok: {path}')

          sys.exit(1 if any_failed else 0)
          PY
