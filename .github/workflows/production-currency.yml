name: Is production current?

# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────────────────────────
#
# On 14 Aug 2026 the primary staff URL served v21.22 for ten hours while `main` moved to v21.26.
# Four consecutive Hosting deploys had failed on a test gate, and the `report-deploy-failure` action
# did its job perfectly — it opened issue #1245 within minutes of the first failure. Nobody read it.
#
# So the gap was never detection of a FAILED DEPLOY. It was that nothing ever asked the only
# question that actually matters: **is the version staff are being served the version we think?**
#
# That question has failure modes the deploy workflow structurally cannot see, because it is not
# running when they happen:
#
#   · a deploy that failed and whose issue went unread (the 14 Aug case);
#   · a deploy that reported success but did not propagate;
#   · a rolled-back or manually-changed Hosting release;
#   · the GitHub Pages mirror drifting from Firebase Hosting, in either direction;
#   · `paths-ignore: '**/*.md'` meaning a stale deploy does NOT self-heal — production stays
#     behind until some unrelated non-docs commit lands.
#
# It runs on a SCHEDULE rather than after a deploy for exactly that reason: a check that only runs
# when the pipeline runs cannot see a pipeline that is not running.
#
# ── WHY IT COMPARES AGAINST `main` AND NOT AGAINST ITSELF ───────────────────────────────────────
#
# `roster-data.js` on `main` is the version that SHOULD be live. Fetching the same file from each
# served origin and comparing is the whole check — no API tokens, no Firebase credentials, no
# deploy permissions. It reads what a member's browser would read.
#
# ── AND WHY IT TOLERATES A LAG — A LONG ONE ─────────────────────────────────────────────────────
#
# A deploy takes MINUTES and the schedule is hourly, so a run can legitimately catch a deploy in
# flight. It therefore keeps re-reading before saying anything: a canary that cries on every deploy
# is one that gets muted, which would leave things exactly where they were on 14 Aug.
#
# How long it waits was MEASURED, not guessed — and then the measurement went out of date, which is
# the real lesson here. The first version re-checked once after 180 seconds, believing a deploy took
# "a few minutes"; deploy-hosting.yml runs the test gate BEFORE it deploys, so the run takes far
# longer, and on 7 Sep 2026 the 20:17 tick raised the alarm six minutes before v23.18 landed. The
# window went to 900s, described as "~13 minutes measured". On 19 Sep 2026 a 17m09s deploy beat it
# by SEVEN SECONDS and emailed the owner that production was stale while it was perfectly healthy.
#
# Raising the number is a treadmill: the next slow deploy wins again, and the duration is not a
# property anybody controls — it is however long the test gate happens to take that day. So the
# window is no longer the only defence. Before the verdict, the run ASKS whether a Hosting deploy is
# actually in flight and stands down if one is, which is correct at any duration. The window stays
# as the backstop for the case that question cannot be answered, and is sized with margin rather
# than to a measurement it would only outlive until the next slow run.

on:
  schedule:
    # Hourly. Frequent enough that a stale production is measured in hours rather than the ten it
    # took to notice by hand, cheap enough to be unremarkable (two curls).
    - cron: '17 * * * *'
  workflow_dispatch:

# Least privilege: read the repo, READ the workflow runs (to see whether a deploy is in flight —
# see the stand-down below), and open an issue when production is stale. No deploy rights — this
# workflow observes and reports, it never fixes.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # The poll below may run for DEPLOY_WINDOW_S; this must exceed it, or a slow-but-successful
    # deploy turns into a cancelled run that reports nothing either way. Raised with the window.
    # 25 polls × (60s sleep + two reads of up to 30s each) is 50 minutes in the worst case, plus the
    # stand-down query. At 35 the job could be CANCELLED mid-poll, and a cancelled job skips the
    # `if: failure()` step — the one that files the issue — so the check fell silent exactly when
    # an origin was hanging (v24.23).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compare every served origin against main
        id: compare
        shell: bash
        env:
          # NOT automatic. A `run` step gets GITHUB_REPOSITORY for free and GITHUB_TOKEN never —
          # and under `set -u` the unset expansion kills the subshell, so the stand-down below
          # would have failed open on every single run while looking exactly like a working guard.
          GITHUB_TOKEN: ${{ github.token }}
          HOSTING_WORKFLOW: deploy-hosting.yml
        run: |
          set -uo pipefail

          version_of() {   # $1 = a base URL; echoes the APP_VERSION it serves, or empty
            curl -fsSL --max-time 30 "$1/roster-data.js" 2>/dev/null \
              | grep -oE "APP_VERSION = '[^']+'" | head -1 | grep -oE "[0-9]+\.[0-9]+" || true
          }

          EXPECTED=$(grep -oE "APP_VERSION = '[^']+'" roster-data.js | head -1 | grep -oE "[0-9]+\.[0-9]+")
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"

          WEB="https://myb-roster.web.app"
          PAGES="https://garethdavidmiller.github.io/roster-app"

          LIVE_WEB=$(version_of "$WEB")
          LIVE_PAGES=$(version_of "$PAGES")

          # A deploy may be in flight. Keep re-reading before accusing anything, and stop the moment
          # both origins agree. A canary that fires on every release is a canary that gets switched
          # off — and on 19 Sep 2026 this one very nearly was.
          #
          # ⚠️ THE WINDOW WAS A GUESS AT A DURATION, AND THE DURATION MOVED. It was 900s against a
          # deploy described as "~13 minutes measured". v24.17's Hosting deploy ran 17:59:58 →
          # 18:17:07 — 17m09s — and this check gave up at 18:17:00. It lost by SEVEN SECONDS and
          # emailed the owner that production was stale while it was perfectly healthy. The head
          # start was not the cause: even started at the same instant, 15 minutes cannot outwait a
          # 17-minute deploy.
          #
          # So the window is no longer the only defence, because raising a number is a treadmill —
          # the next slow deploy wins again. The step below ASKS whether a Hosting deploy is
          # actually in flight for this commit and stands down if so, which is true at any duration.
          # The window remains as the backstop for the case that question cannot be answered.
          DEPLOY_WINDOW_S=1500
          POLL_S=60
          waited=0
          while { [ "$LIVE_WEB" != "$EXPECTED" ] || [ "$LIVE_PAGES" != "$EXPECTED" ]; } && [ "$waited" -lt "$DEPLOY_WINDOW_S" ]; do
            echo "Read disagreed after ${waited}s (web=$LIVE_WEB pages=$LIVE_PAGES, expected=$EXPECTED) — a deploy may be in flight; re-checking in ${POLL_S}s."
            sleep "$POLL_S"
            waited=$((waited + POLL_S))
            LIVE_WEB=$(version_of "$WEB")
            LIVE_PAGES=$(version_of "$PAGES")
          done

          echo "web=$LIVE_WEB"     >> "$GITHUB_OUTPUT"
          echo "pages=$LIVE_PAGES" >> "$GITHUB_OUTPUT"

          # ── STAND DOWN IF A DEPLOY IS STILL RUNNING ────────────────────────────────────────
          # Asked only when the reads still disagree, so the happy path costs nothing. A Hosting
          # deploy that has not finished means production is EXPECTED to be behind main; saying so
          # is not a finding, it is a description of a deploy — and it is true at ANY duration,
          # which the window above can never be.
          #
          # It asks the WORKFLOW FILE, not the workflow's display name. A name match ("Hosting" in
          # r['name']) reads fine and stops working silently the day somebody retitles the deploy;
          # the filename is what the repo actually keys on, and workflow-hygiene.test.mjs fails if
          # HOSTING_WORKFLOW ever names a file that is not there.
          #
          # Failing open is deliberate: if the query cannot be answered we fall through and report
          # exactly as before, because a canary that goes quiet when it cannot see is worse than one
          # that occasionally cries wolf.
          # ONLY A web.app VERSION MISMATCH, AND ONLY FOR THIS COMMIT (v24.23). The stand-down used
          # to fire whenever any Hosting run on main was unfinished, whatever the mismatch — so an
          # UNREADABLE origin, or a stale Pages mirror (which that workflow does not deploy), went
          # unreported for as long as any deploy overlapped the check. A Hosting deploy explains
          # exactly one thing: web.app serving an older, READABLE version while this commit ships.
          if [ -n "$LIVE_WEB" ] && [ "$LIVE_WEB" != "$EXPECTED" ] && [ "$LIVE_PAGES" = "$EXPECTED" ]; then
            # ONE LINE ON PURPOSE. The first cut of this piped into a `python3 -c "` heredoc
            # whose body sat at column 0 — below the `run: |` block scalar's own indent, which
            # ENDS the scalar and makes the whole workflow unparseable YAML. Indenting the body
            # is not a fix either, because then Python rejects it. jq is preinstalled on
            # ubuntu-latest; if it ever is not, this yields empty and the run reports as before.
            IN_FLIGHT=$(curl -fsSL --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$HOSTING_WORKFLOW/runs?branch=main&per_page=5" \
              2>/dev/null \
              | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.status != "completed" and .head_sha == $sha)] | first | .html_url // empty' \
              2>/dev/null || true)
            if [ -n "$IN_FLIGHT" ]; then
              echo "::notice::Production is behind main and a Hosting deploy is STILL RUNNING ($IN_FLIGHT). That is a deploy in progress, not a stale production. Standing down."
              exit 0
            fi
          fi

          STALE=""
          # An UNREADABLE origin is reported too, and deliberately not as "stale": a 404 or a TLS
          # failure on the staff URL is worse than an old version, and the two need different
          # remedies. CLAUDE.md's deployment health check exists because exactly that went unnoticed.
          [ -z "$LIVE_WEB" ]                  && STALE="$STALE web.app:UNREADABLE"
          [ -n "$LIVE_WEB" ]   && [ "$LIVE_WEB"   != "$EXPECTED" ] && STALE="$STALE web.app:v$LIVE_WEB"
          [ -z "$LIVE_PAGES" ]                && STALE="$STALE pages:UNREADABLE"
          [ -n "$LIVE_PAGES" ] && [ "$LIVE_PAGES" != "$EXPECTED" ] && STALE="$STALE pages:v$LIVE_PAGES"

          if [ -n "$STALE" ]; then
            echo "stale=$STALE" >> "$GITHUB_OUTPUT"
            echo "::error::Production is not current. Expected v$EXPECTED —$STALE"
            exit 1
          fi
          echo "Both origins are serving v$EXPECTED."

      - name: Say so, once, in an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ steps.compare.outputs.expected }}
          STALE: ${{ steps.compare.outputs.stale }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          LABEL="deploy-failure"

          # DEDUPED onto the existing label, so a stale production and the failed deploy that caused
          # it are ONE thread rather than two. A run of hourly checks is one situation; N issues is
          # how a channel teaches its reader to ignore it — the same rule report-deploy-failure uses.
          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 --json number \
            --jq '.[0].number' 2>/dev/null || true)

          BODY=$(printf '%s\n' \
          "**Staff are not being served the current version.**" \
          "" \
          "| | |" \
          "|---|---|" \
          "| Expected (\`main\`) | \`v${EXPECTED}\` |" \
          "| Disagreeing origins | \`${STALE}\` |" \
          "| Checked | ${RUN_URL} |" \
          "" \
          "This was read from the served \`roster-data.js\` on each origin — the same file a" \
          "member's browser fetches — re-read every minute until the deploy window elapsed, and" \
          "checked against the Actions API for a Hosting deploy still running. It is not a deploy" \
          "in flight." \
          "" \
          "### Checking your own phone will not show this" \
          "" \
          "The app is offline-first: an installed phone keeps launching from its service-worker" \
          "cache and looks perfectly healthy. CLAUDE.md → *\"The installed PWA masks live-site" \
          "breakage\"*." \
          "" \
          "### Where to look" \
          "" \
          "1. The most recent \`deploy-hosting.yml\` run — a failed test gate blocks the deploy and" \
          "   does **not** self-heal, because \`paths-ignore: '**/*.md'\` means a docs commit will" \
          "   not retry it." \
          "2. If that run succeeded, the deploy did not propagate — check the Firebase Hosting" \
          "   release history." \
          "3. \`UNREADABLE\` means the origin did not answer at all. That is worse than stale," \
          "   and RECOVERY_RUNBOOK.md → *\"GitHub-mirror failover\"* is the page for it.")

          # Never fails the job: this step only runs when something has already gone wrong, and a
          # failed notification must not bury the real error under a second one.
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "$BODY" \
              || echo "::warning::could not comment on issue #${EXISTING}"
          else
            gh issue create --title "⚠️ Production is not current — staff are on an old version" \
              --label "$LABEL" --body "$BODY" \
              || echo "::warning::could not open the stale-production issue"
          fi
