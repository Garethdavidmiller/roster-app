name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Run the deploy TOOL (firebase-tools) on Node 20 to match deploy-hosting.yml.
          # Functions deploys were failing with a bare "Failed to authenticate" on Node 22
          # while Hosting (Node 20) succeeded — same credentials mechanism
          # (GOOGLE_APPLICATION_CREDENTIALS), so the only structural difference was the
          # deploy-tool Node version. (Both now authenticate via Workload Identity Federation;
          # the auth action exports GOOGLE_APPLICATION_CREDENTIALS the same way regardless of
          # Node version.) The deployed function RUNTIME is still Node 22 (set by
          # functions/package.json `engines`); this only changes the Node that runs
          # firebase-tools in CI.
          node-version: '20'

      # Install root dev dependencies so the repo lint/typecheck gate can run here
      # (the Functions workflow previously skipped it, so a lint failure that blocks
      # the app deploy could still ship functions/index.js — v14.11 review). Having
      # the root toolchain installed also pins `npx firebase` to the locked version
      # rather than letting npx fetch a current release at deploy time.
      - name: Install root dependencies
        run: npm ci

      - name: Lint and type-check (repo gate)
        run: |
          npm run lint
          npm run typecheck

      - name: Syntax check (functions)
        run: |
          node --check functions/index.js
          node --check functions/roster-parse-helpers.js

      - name: Run parser helper tests
        run: npm run test:functions

      - name: Check roster-members.json is in sync with roster-data.js
        run: node --test --test-name-pattern "roster-members" sw-asset-check.test.mjs

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account; the action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools (run on Node 20, see above) picks up automatically. Final
      # workflow migrated after rules + hosting proved WIF. SECURITY_RELEASE_PLAN.md → A2.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      - name: Deploy to Firebase
        run: |
          set +e
          npx firebase deploy --only functions --force --project myb-roster \
            > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          [ $code -eq 0 ] && exit 0
          # Firebase sometimes returns non-zero purely because it could not set an
          # Artifact Registry cleanup policy, even though the functions deployed fine.
          # Trust a POSITIVE success marker ("Deploy complete!") rather than the broad
          # "cleanup policy" substring — which would also swallow a real failure whose
          # output merely mentions the phrase.
          if grep -q "Deploy complete!" /tmp/out.txt; then
            echo "Functions deployed; non-zero exit was a benign post-deploy warning (e.g. cleanup policy)."
            exit 0
          fi
          exit $code
