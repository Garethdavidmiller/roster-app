name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Syntax check (functions)
        run: |
          node --check functions/index.js
          node --check functions/roster-parse-helpers.js

      - name: Run parser helper tests
        run: npm run test:functions

      - name: Check roster-members.json is in sync with roster-data.js
        run: node --test --test-name-pattern "roster-members" sw-asset-check.test.mjs

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/key.json

      - name: Deploy to Firebase
        run: |
          set +e
          npx firebase deploy --only functions --force --project myb-roster \
            > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          [ $code -eq 0 ] && exit 0
          # Firebase sometimes returns non-zero purely because it could not set an
          # Artifact Registry cleanup policy, even though the functions deployed fine.
          # Trust a POSITIVE success marker ("Deploy complete!") rather than the broad
          # "cleanup policy" substring — which would also swallow a real failure whose
          # output merely mentions the phrase.
          if grep -q "Deploy complete!" /tmp/out.txt; then
            echo "Functions deployed; non-zero exit was a benign post-deploy warning (e.g. cleanup policy)."
            exit 0
          fi
          exit $code
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
