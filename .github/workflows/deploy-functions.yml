name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

# ── ONE DEPLOY AT A TIME, AND THE NEWEST ONE LAST (1 Sep 2026) ─────────────────────────────────
# Same rule and the same reasoning as deploy-hosting.yml, which carries the argument: QUEUE, never
# cancel, and a group that is per-workflow and ref-independent. Do not copy e2e.yml's
# `cancel-in-progress: true` here — that one is cancelling a redundant test run.
# The stakes are highest in THIS one: a functions deploy is not atomic, so a cancelled or
# overtaken run can leave some functions on the new code and the rest on the old — a split
# deploy surface, which is the one state no rollback plan describes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── THE TESTS RUN WHERE NO GOOGLE CREDENTIAL CAN BE MINTED (review, 17 Nov 2026) ───────────────
  #
  # The tests and the deploy were one job, and that job held `id-token: write` — which GitHub turns
  # into a token-request address and bearer in the environment of EVERY step, and Workload Identity
  # Federation accepts any run from main. So every dependency's install script and every test ran
  # where it could mint the deploy account's credential. deploy-hosting.yml has had this shape since
  # 10 Nov 2026, and this is the same: `check` installs and tests with a read-only token, and
  # `deploy` — which needs it, so a red, cancelled or skipped `check` uploads nothing — is the one job
  # that can sign in. It installs with `npm ci --ignore-scripts` and runs no test.
  #
  # Without install scripts the deploy tool and the functions still load: measured on 17 Nov 2026 in
  # a copy installed that way, `firebase --version` ran, a deploy dry run reached sign-in, and the
  # Functions emulator's discovery — the step a deploy runs to read what index.js exports — loaded
  # every function. The lockfiles hold three install scripts: @firebase/util's writes defaults its
  # package already ships, protobufjs's prints a warning, and re2 builds an optional native matcher
  # that only the Hosting emulator reads, falling back without it.
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # No token left on disk: every dependency's install script runs in this job, and nothing here
      # needs git credentials (deploy-hosting.yml says why).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The deploy TOOL (firebase-tools) runs on Node 24 since v25.30 (4 Nov 2026), with the
          # runtime. It ran on 22 from 3 Nov, and before that was held on 20 because Functions deploys
          # once failed with a bare "Failed to authenticate" on 22 while Hosting on 20 succeeded —
          # under the retired key file. Every deploy now signs in by Workload Identity Federation,
          # proven on 22. IF A DEPLOY FAILS TO AUTHENTICATE, set the deploy job's Node steps below
          # (and their twins in deploy-hosting.yml and deploy-rules.yml) back to '22' first. The
          # deployed function RUNTIME is Node 24 either way (functions/package.json `engines`); this
          # is only the Node that runs firebase-tools in CI.
          node-version: '24'
          # Cache npm's download store (keyed on the lockfile, so a dependency change still
          # invalidates it). This caches ~/.npm, NOT node_modules — `npm ci` still unpacks and
          # links every package, so it removes fetch time and not install time. Measured 4 Sep
          # 2026: deploy-hosting, which has had this since v20.96, still spent 6m05s installing.
          # It is free and strictly better; it is not a cure for a slow install.
          cache: 'npm'

      # Install root dev dependencies so the repo lint/typecheck gate can run here
      # (the Functions workflow previously skipped it, so a lint failure that blocks
      # the app deploy could still ship functions/index.js — v14.11 review).
      - name: Install root dependencies
        run: npm ci

      - name: Lint and type-check (repo gate)
        run: |
          npm run lint
          npm run typecheck

      # EVERY functions module, not a hand-list. The list held two names while push.js (v20.52),
      # documents.js and auth-endpoints.js (v20.55) arrived unchecked — a hand-maintained list
      # stops covering what arrives after it.
      - name: Syntax check (functions)
        run: |
          for f in functions/*.js; do node --check "$f"; done

      # BEFORE test:functions, which since v20.55 includes functions-surface.test.mjs — it
      # require()s functions/index.js to pin the deployed function surface, and that pulls
      # firebase-admin/firebase-functions from functions/node_modules. With the install after the
      # tests (the old order), the surface pin would have failed on every CI run while passing on
      # any dev machine that had ever installed — the classic works-here gap.
      # ── THE RUNTIME'S NODE ──────────────────────────────────────────────────────────────────
      # The deployed runtime IS Node 24 (functions/package.json, since v25.30; firebase-admin v14
      # declares `engines: {"node": ">=22"}`). The deploy TOOL once needed Node 20 (see the
      # setup-node comment at the top of this job), so the two requirements are satisfied in
      # sequence rather than by choosing between them: install and TEST the handlers on the version
      # they actually run on. (firebase-tools then stepped back to 20 until 3 Nov 2026; it runs on
      # the runtime's Node now.)
      #
      # Without this the job would install a package it declares unsupported (npm treats `engines`
      # as advisory with no `.npmrc` engine-strict, so it warns and proceeds) and then exercise
      # every handler on a Node the SDK does not support — a green gate that proves nothing about
      # production. The PR-side `functions` job in e2e.yml has run on the runtime's Node since
      # v21.82 (24 since v25.30) for the same reason; this closes the same gap on the deploy side.
      - name: Switch to the Functions runtime Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Run functions tests (parser helpers, deploy-surface pin, overtime + auth endpoints)
        run: npm run test:functions

      # The browser (auth-identity.js) and functions (roster-parse-helpers.js) each hold a
      # deliberate duplicate of the surname/password derivation. surname-parity.test.mjs is the
      # ONLY guard that they stay in sync — and a functions-only push never triggers the hosting
      # workflow that runs the full suite, so run it here too or a drifted derivation would ship
      # green and break every staff login at the next account re-provision.
      # THE WHOLE ROOT SUITE, NOT TWO PICKED FILES (Oct 2026 production review). This workflow is the
      # only one a functions-only push runs — deploy-hosting has `paths-ignore: functions/**` — and
      # several root suites test functions/ code directly (overtime-core, london-clock,
      # member-identity, doc-url-core, the parity suites). Two hand-picked files here
      # left them unrun on exactly the push that changes what they test. `npm test` subsumes both.
      - name: Run the root suites (includes surname parity and the roster-members sync)
        run: npm test

      # The rule, and why an unreachable npm is not a finding, is in the script's own header.
      # This is the DEPLOY gate, so an unknown warns and proceeds: blocking a release — including
      # an emergency fix — on npm's uptime costs more than it buys, and the Monday monitor still
      # fails loudly if the check has not run all week. A real advisory blocks here regardless.
      - name: Audit production dependencies
        env:
          AUDIT_UNKNOWN_IS_FAILURE: '0'
        run: bash scripts/audit-functions-deps.sh

  deploy:
    # The gate above. The `if:` below names no status function, so GitHub adds `success()`: `check`
    # red, cancelled or skipped, and this job does not run.
    needs: [check]
    # ── PRODUCTION DEPLOYS ONLY EVER RUN FROM `main` (v22.32, external review) ─────────────────
    #
    # `workflow_dispatch` above carries no branch restriction, and the concurrency group above
    # QUEUES rather than cancels — but GitHub keeps only ONE pending run per group, so a newer
    # pending run displaces the previous one. That is safe for consecutive pushes to main, where
    # the later tree contains the earlier one. It is NOT safe across branches:
    #
    #     main A deploying → main B pending → someone dispatches branch C → B is displaced
    #                                       → production finishes on C, not on B
    #
    # Production would then be running a branch while `main` holds the newer tree, and nothing
    # would say so. It takes a deliberate act by someone with write access, which is why this is
    # hardening rather than a defect, and the guard costs one line. It stops C deploying. It does
    # NOT stop C displacing B (10 Nov 2026 review): the run joins the queue before this condition
    # is read, so B still never deploys and production stays on A. The `not-main` job below makes
    # such a run fail and say so. Keeping branch runs out of the queue altogether would key the
    # group on the ref, which deploy-hosting.yml's concurrency comment decides against.
    #
    # If deploying a non-main ref is ever genuinely needed (a rollback to a tag, say), add an
    # explicit input and widen this condition to name it. Do not simply delete the check. The gate
    # job above carries the same condition, so a branch run spends no time testing either.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A functions deploy builds every function and is not atomic: a deploy cut off by its limit can
    # leave the split surface described at the top of this file, so the limit is generous.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read     # the re-run check below lists this workflow's runs
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # No token left on disk: nothing here needs git credentials (deploy-hosting.yml says why).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A RE-RUN MUST NOT PUT OLDER FUNCTIONS LIVE (whole-app review, 10 Nov 2026) — the action's
      # header has the account. A first attempt passes straight through. A re-run's gate job runs
      # before this is reached, so a refused re-run still costs its time; never a deploy.
      - name: A re-run deploys only if no newer run has overtaken it
        uses: ./.github/actions/refuse-overtaken-rerun

      # firebase-tools comes from the root lockfile: without it `npx firebase` would fetch whatever
      # version is newest on the day. The functions' own packages are installed too, because a
      # deploy LOADS index.js to read what it exports before it uploads anything.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # NO INSTALL SCRIPT RUNS IN THIS JOB: it can mint a Google credential (the comment at the top
      # of `jobs:` says why, and what was measured).
      - name: Install the deploy tool (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install function dependencies (no install scripts)
        run: npm ci --ignore-scripts
        working-directory: functions

      # ── THE DEPLOY TOOL'S NODE ──────────────────────────────────────────────────────────────
      # Everything from here on is firebase-tools: Node 24 since v25.30, 22 from 3 Nov 2026 (the
      # `check` job's first setup step has why it was 20, and why that no longer held). Kept as its
      # own step so that going back to 22, if a deploy ever fails to authenticate, is one line.
      - name: Deploy-tool Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account; the action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools (run on Node 24, see above) picks up automatically. Final
      # workflow migrated after rules + hosting proved WIF. SECURITY_RELEASE_PLAN.md → A2.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      # `--force` is what lets a release DELETE a function: run without a terminal, `firebase deploy`
      # refuses when a deployed function is missing from index.js's exports, and `--force` deletes it
      # instead (it also answers the CLI's other prompts). So a removal ships by leaving the export —
      # Overtime's pause (OVERTIME_AVAILABILITY.md) and the retired staff PIN's `unlockCalendarViewer`
      # both went that way — and an export dropped by MISTAKE is deleted from production just as
      # surely; functions-surface.test.mjs, run in `check` above, is what stands in front of that.
      - name: Deploy to Firebase
        run: |
          set +e
          npx firebase deploy --only functions --force --project myb-roster \
            > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          [ $code -eq 0 ] && exit 0
          # Firebase sometimes returns non-zero purely because it could not set an
          # Artifact Registry cleanup policy, even though the functions deployed fine.
          # Trust a POSITIVE success marker ("Deploy complete!") rather than the broad
          # "cleanup policy" substring — which would also swallow a real failure whose
          # output merely mentions the phrase.
          if grep -q "Deploy complete!" /tmp/out.txt; then
            echo "Functions deployed; non-zero exit was a benign post-deploy warning (e.g. cleanup policy)."
            exit 0
          fi
          exit $code

  # ── A RUN FROM ANOTHER BRANCH DEPLOYS NOTHING, AND SAYS SO (whole-app review, 10 Nov 2026) ───
  # deploy-hosting.yml has the account.
  not-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Deploys run only from main
        run: |
          echo "::error title=Nothing was deployed::This workflow deploys only from main, and this run was started on $GITHUB_REF_NAME. If a deploy from main was waiting when it started, this run took its place in the queue and that release has not gone out. To deploy main: Actions tab, \"$GITHUB_WORKFLOW\", Run workflow, on main."
          exit 1

  # ── AND A FAILURE BEFORE THE FIRST STEP MUST NOT BE SILENT EITHER ───────────────────────────
  #
  # The reporter used to be the deploy job's own last step, guarded by `if: failure()`, and its
  # comment claimed that covered "EVERY step above". True, and not the whole surface: a step-level
  # guard cannot run when NO step runs. On 14 Aug 2026 this workflow failed in `Prepare all
  # required actions` — codeload would not serve the pinned `actions/setup-java` — so the job died
  # during setup, every step including the reporter was skipped, and the deploy failed in exactly
  # the silence the reporter exists to prevent. It was found by hand, days later.
  #
  # A SEPARATE JOB closes that: `needs` + a job-level `if: failure()` fires when the deploy job
  # fails for ANY reason, setup included. It REPLACES the in-job step rather than joining it —
  # two reporters on one failure would comment twice on the same issue, and a notification
  # channel that repeats itself is one people stop reading.
  #
  # The irreducible tail: this job needs `checkout` and the action itself, so a codeload outage
  # broad enough to take those down takes the reporter with it. Nothing inside a workflow can
  # report that. It is a far smaller target than the four actions the deploy job pulls.
  #
  # …NOR A DEPLOY THAT RUNS OUT OF TIME (whole-app review, 10 Nov 2026) — deploy-hosting.yml has
  # the incident. A cancelled job is not a failed one, so `failure()` alone missed it, and nothing
  # else watches this deploy: one cut off mid-release can leave the split surface described at the
  # top of this file, and nobody would be told.
  #
  # …AND IT WAITS FOR THE GATE AS WELL AS THE DEPLOY (17 Nov 2026), as deploy-hosting.yml's does: a
  # `check` that runs out of time ends cancelled and leaves `deploy` skipped, which neither `failure()`
  # nor a cancelled check of `deploy` alone would see. The notice says "cut off part-way" only when
  # `deploy` itself was cancelled; a cancelled `check` uploaded nothing.
  report-failure:
    needs: [check, deploy]
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report-deploy-failure
        with:
          target: 'Cloud Functions'
          token: ${{ github.token }}
          result: ${{ needs.deploy.result == 'cancelled' && 'cancelled' || 'failure' }}
