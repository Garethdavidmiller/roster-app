name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

# ── ONE DEPLOY AT A TIME, AND THE NEWEST ONE LAST (1 Sep 2026) ─────────────────────────────────
# Same rule and the same reasoning as deploy-hosting.yml, which carries the argument: QUEUE, never
# cancel, and a group that is per-workflow and ref-independent. Do not copy e2e.yml's
# `cancel-in-progress: true` here — that one is cancelling a redundant test run.
# The stakes are highest in THIS one: a functions deploy is not atomic, so a cancelled or
# overtaken run can leave some functions on the new code and the rest on the old — a split
# deploy surface, which is the one state no rollback plan describes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    # ── PRODUCTION DEPLOYS ONLY EVER RUN FROM `main` (v22.32, external review) ─────────────────
    #
    # `workflow_dispatch` above carries no branch restriction, and the concurrency group below
    # QUEUES rather than cancels — but GitHub keeps only ONE pending run per group, so a newer
    # pending run displaces the previous one. That is safe for consecutive pushes to main, where
    # the later tree contains the earlier one. It is NOT safe across branches:
    #
    #     main A deploying → main B pending → someone dispatches branch C → B is displaced
    #                                       → production finishes on C, not on B
    #
    # Production would then be running a branch while `main` holds the newer tree, and nothing
    # would say so. It takes a deliberate act by someone with write access, which is why this is
    # hardening rather than a defect — but the guard costs one line and removes the whole class.
    #
    # If deploying a non-main ref is ever genuinely needed (a rollback to a tag, say), add an
    # explicit input and widen this condition to name it. Do not simply delete the check.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Run the deploy TOOL (firebase-tools) on Node 20 to match deploy-hosting.yml.
          # Functions deploys were failing with a bare "Failed to authenticate" on Node 22
          # while Hosting (Node 20) succeeded — same credentials mechanism
          # (GOOGLE_APPLICATION_CREDENTIALS), so the only structural difference was the
          # deploy-tool Node version. (Both now authenticate via Workload Identity Federation;
          # the auth action exports GOOGLE_APPLICATION_CREDENTIALS the same way regardless of
          # Node version.) The deployed function RUNTIME is still Node 22 (set by
          # functions/package.json `engines`); this only changes the Node that runs
          # firebase-tools in CI.
          node-version: '20'

      # Install root dev dependencies so the repo lint/typecheck gate can run here
      # (the Functions workflow previously skipped it, so a lint failure that blocks
      # the app deploy could still ship functions/index.js — v14.11 review). Having
      # the root toolchain installed also pins `npx firebase` to the locked version
      # rather than letting npx fetch a current release at deploy time.
      - name: Install root dependencies
        run: npm ci

      - name: Lint and type-check (repo gate)
        run: |
          npm run lint
          npm run typecheck

      # EVERY functions module, not a hand-list. The list held two names while push.js (v20.52),
      # documents.js and auth-endpoints.js (v20.55) arrived unchecked — a hand-maintained list
      # stops covering what arrives after it.
      - name: Syntax check (functions)
        run: |
          for f in functions/*.js; do node --check "$f"; done

      # BEFORE test:functions, which since v20.55 includes functions-surface.test.mjs — it
      # require()s functions/index.js to pin the eleven-function deploy surface, and that pulls
      # firebase-admin/firebase-functions from functions/node_modules. With the install after the
      # tests (the old order), the surface pin would have failed on every CI run while passing on
      # any dev machine that had ever installed — the classic works-here gap.
      # ── NODE 22 WINDOW ──────────────────────────────────────────────────────────────────────
      # firebase-admin v14 declares `engines: {"node": ">=22"}`, and the deployed runtime IS 22
      # (functions/package.json). The deploy TOOL below still needs Node 20 (see the setup-node
      # comment at the top of this job), so the two requirements are satisfied in sequence rather
      # than by choosing between them: install and TEST the handlers on the version they actually
      # run on, then step back to 20 for firebase-tools.
      #
      # Without this the job would install a package it declares unsupported (npm treats `engines`
      # as advisory with no `.npmrc` engine-strict, so it warns and proceeds) and then exercise
      # every handler on a Node the SDK does not support — a green gate that proves nothing about
      # production. The PR-side `functions` job in e2e.yml has been on 22 since v21.82 for the
      # same reason; this closes the same gap on the deploy side.
      - name: Switch to the Functions runtime Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Run functions tests (parser helpers, deploy-surface pin, overtime + auth endpoints)
        run: npm run test:functions

      # The browser (auth-identity.js) and functions (roster-parse-helpers.js) each hold a
      # deliberate duplicate of the surname/password derivation. surname-parity.test.mjs is the
      # ONLY guard that they stay in sync — and a functions-only push never triggers the hosting
      # workflow that runs the full suite, so run it here too or a drifted derivation would ship
      # green and break every staff login at the next account re-provision.
      - name: Check browser/functions surname derivation stays in sync
        run: node --test surname-parity.test.mjs

      - name: Check roster-members.json is in sync with roster-data.js
        run: node --test --test-name-pattern "roster-members" sw-asset-check.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions

      # ── BACK TO NODE 20 FOR THE DEPLOY TOOL ─────────────────────────────────────────────────
      # Closes the window opened above. Everything from here on is firebase-tools, which is pinned
      # to 20 by the empirical auth failure recorded at the top of this job.
      - name: Switch back to the deploy-tool Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account; the action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools (run on Node 20, see above) picks up automatically. Final
      # workflow migrated after rules + hosting proved WIF. SECURITY_RELEASE_PLAN.md → A2.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      - name: Deploy to Firebase
        run: |
          set +e
          npx firebase deploy --only functions --force --project myb-roster \
            > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          [ $code -eq 0 ] && exit 0
          # Firebase sometimes returns non-zero purely because it could not set an
          # Artifact Registry cleanup policy, even though the functions deployed fine.
          # Trust a POSITIVE success marker ("Deploy complete!") rather than the broad
          # "cleanup policy" substring — which would also swallow a real failure whose
          # output merely mentions the phrase.
          if grep -q "Deploy complete!" /tmp/out.txt; then
            echo "Functions deployed; non-zero exit was a benign post-deploy warning (e.g. cleanup policy)."
            exit 0
          fi
          exit $code

  # ── AND A FAILURE BEFORE THE FIRST STEP MUST NOT BE SILENT EITHER ───────────────────────────
  #
  # The reporter used to be the deploy job's own last step, guarded by `if: failure()`, and its
  # comment claimed that covered "EVERY step above". True, and not the whole surface: a step-level
  # guard cannot run when NO step runs. On 14 Aug 2026 this workflow failed in `Prepare all
  # required actions` — codeload would not serve the pinned `actions/setup-java` — so the job died
  # during setup, every step including the reporter was skipped, and the deploy failed in exactly
  # the silence the reporter exists to prevent. It was found by hand, days later.
  #
  # A SEPARATE JOB closes that: `needs` + a job-level `if: failure()` fires when the deploy job
  # fails for ANY reason, setup included. It REPLACES the in-job step rather than joining it —
  # two reporters on one failure would comment twice on the same issue, and a notification
  # channel that repeats itself is one people stop reading.
  #
  # The irreducible tail: this job needs `checkout` and the action itself, so a codeload outage
  # broad enough to take those down takes the reporter with it. Nothing inside a workflow can
  # report that. It is a far smaller target than the four actions the deploy job pulls.
  report-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/report-deploy-failure
        with:
          target: 'Cloud Functions'
          token: ${{ github.token }}
