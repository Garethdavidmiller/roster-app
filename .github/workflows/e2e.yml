name: Tests

# Runs on every branch so issues are caught before merging to main,
# not only at deploy time.
on:
  push:
    branches-ignore:
      - main        # deploy-hosting.yml already runs these on main
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Deployment-hygiene tests run here (not only at deploy) so the
      # doc-checkpoint tripwire and version-consistency checks gate every
      # branch and PR — catching a missed 0.10 doc sweep before merge, not after.
      - name: Run unit and hygiene tests
        run: |
          # Canonical check command (lint + tests) lives in package.json.
          npm run check

  # E2E smoke suite — real headless Chromium, Firebase SDK stubbed at the network
  # layer (e2e/fixtures.js) so the suite never depends on the gstatic CDN. Catches
  # blank-page failures (SyntaxError, missing import, broken module graph) that every
  # unit test passes but that would ship a broken page to staff. (It does NOT run under
  # firebase.json's CSP — the local http-server applies no headers; the `csp` job below
  # proves the CSP at runtime via the Hosting emulator, and csp-hygiene.test.mjs checks the
  # config statically.) Separate job so a smoke failure is attributable at a glance and runs
  # in parallel with unit.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # CI runners have no pre-installed browser, so fetch Chromium here. (The
      # Claude Code dev environment ships Chromium at /opt/pw-browsers, which is
      # why the suite is now locally runnable — see ROADMAP "E2E smoke tests".)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── SAFARI'S ENGINE (v21.28) ─────────────────────────────────────────────────────────────────
  #
  # iOS is a supported platform carrying a dozen documented Safari workarounds, and until now not
  # one of them was exercised by a browser that behaves that way. The first WebKit run found a test
  # asserting the notification bell exists unconditionally — a Chromium assumption, where the app
  # was right and the test was provincial.
  #
  # It runs HERE and not in deploy-hosting.yml on purpose: a second engine in the deploy gate would
  # double the critical path and let a WebKit-only flake keep staff on a stale version, which is the
  # failure that had production four releases behind on 14 Aug 2026.
  webkit:
    runs-on: ubuntu-latest
    # 20 → 35 (v21.78). This job runs the whole smoke suite twice — desktop WebKit and Mobile
    # Safari — on top of a `--with-deps` browser install, and it had grown to 19m33s against a
    # 20-minute cap: green, and one minute from not being. It was CANCELLED at 20m15s the first
    # time a branch push and its PR ran concurrently and competed for runners. A cancelled job
    # reads exactly like a failed one on the PR, which is the worst outcome for a check that is
    # deliberately NOT the deploy gate — it teaches you to ignore a red WebKit. The headroom is
    # generous on purpose: the cap is there to stop a hung job burning a runner for six hours,
    # not to police the suite's length. If it ever approaches 35 minutes, split the two engine
    # projects into separate jobs rather than raising this again.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # `--with-deps` matters here in a way it does not for Chromium: WebKit needs a long list of
      # GTK/GStreamer libraries that no runner ships by default, and without them every test fails
      # at browser launch with an error that looks nothing like a test failure.
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run the smoke suite under WebKit
        run: npm run test:webkit
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  # Emulator integration pack — Firestore + Storage security rules exercised against the REAL
  # emulators (npm run test:rules). This previously ran ONLY at rules-deploy time
  # (deploy-rules.yml); running it here gates every branch/PR, so a rules ↔ app contract
  # regression is caught before merge, not at deploy.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # parity with deploy-rules.yml (silences JS-action node-version warnings)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # firebase-tools v15 requires Java 21+ for the Firestore/Storage emulators.
      - name: Install Java 21 (Firebase emulators)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # emulators:exec downloads the emulator binaries into ~/.cache/firebase/emulators on each run
      # (CI runners are ephemeral, so there is no cross-run cache unless an actions/cache step is added
      # — a possible future speed-up; the download is ~1 min and not correctness-relevant).
      - name: Run Firestore and Storage rules tests
        run: npm run test:rules

  # Deployed-CSP proof — serves the app via the Firebase Hosting emulator, which applies
  # firebase.json's real Content-Security-Policy header, then loads every page in real Chromium
  # and asserts the browser refuses nothing the app legitimately loads. This is the runtime
  # counterpart to the static csp-hygiene.test.mjs and closes the gap the http-server smoke job
  # can't (no headers). The Hosting emulator is Node-based, so no Java is needed here.
  csp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed-CSP proof
        run: npm run test:csp
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-csp
          path: playwright-report/
          retention-days: 7

  # ── VISUAL BASELINES — REPORT-ONLY, ON PURPOSE (v21.54) ──────────────────────────────────────
  #
  # This job CANNOT fail the build (`continue-on-error`), and that is the whole design rather than
  # a hedge. Pixel output depends on the renderer: the committed baselines were generated in the
  # dev container, this runner installs its own browser on ubuntu-latest, and font hinting alone
  # will differ. A blocking job on that footing would go red for reasons nobody can act on, and the
  # reliable way to make a red build green is to stop believing it.
  #
  # WHAT IT IS FOR is the other half. The suite is opt-in, and twice in one day (v21.53) a baseline
  # was found stale — `admin-mobile-390` had been wrong since 81a0ada, a deliberate spacing change
  # that shipped without a re-baseline. A stale baseline is worse than none: it still looks like a
  # reference, so the next real regression lands inside a diff that is already large and nobody can
  # tell the new breakage from the old drift. The habit ("run it before merging a CSS change")
  # failed twice, and a habit that needs remembering is the weakest control this repo has.
  #
  # So it runs on every branch and uploads its diff images. It converts "nobody remembered" into an
  # artifact on the PR — which is detection, not enforcement, and detection is what was missing.
  #
  # THE PATH FORWARD is the one the accessibility gate already walked: it started opt-in with a
  # documented baseline, was watched until it proved stable, and became blocking at v17.52. Watch
  # this one's noise for a few weeks. If the runner's diffs are consistently empty, pin the browser
  # image, regenerate the baselines on it and promote this to blocking. If they are consistently
  # noisy, that is the answer too, and it stays report-only for good.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `|| true` as well as continue-on-error: the step's own exit code is what decides whether
      # the upload below runs, and a diff we cannot see is the one thing this job must not produce.
      - name: Compare against the committed visual baselines
        run: npm run test:visual || true
        env:
          CI: true

      # ALWAYS uploaded, pass or fail. On a clean run the artifact is near-empty and costs nothing;
      # on a drifted one it carries the expected/actual/diff triple, which is the entire point.
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
