name: Smoke tests

# Runs on every branch so issues are caught before merging to main,
# not only at deploy time.
on:
  push:
    branches-ignore:
      - main        # deploy-hosting.yml already runs these on main
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Fast unit / deployment-hygiene tests run here too (not only at deploy)
      # so the doc-checkpoint tripwire and version-consistency checks gate every
      # branch and PR — catching a missed 0.10 doc sweep before merge, not after.
      - name: Run unit and hygiene tests
        run: |
          node --test sw-asset-check.test.mjs links-design.test.mjs admin-rangepicker.test.mjs
          node --experimental-vm-modules --test module-parse.test.mjs
          node --experimental-test-module-mocks --test roster-data.test.mjs paycalc.test.mjs paycalc-roster-suggestions.test.mjs roster-parse-helpers.test.mjs app.test.mjs

      - name: Run smoke tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
