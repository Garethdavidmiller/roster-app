name: Tests

# Runs on every branch so issues are caught before merging to main,
# not only at deploy time.
on:
  push:
    branches-ignore:
      - main        # deploy-hosting.yml already runs these on main
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  pull_request:

# ── ONE RUN PER BRANCH (1 Sep 2026) ────────────────────────────────────────────────────────────
#
# Without this a branch carried TWO full suites at once and neither knew about the other. Both
# `push` and `pull_request` fire here, so opening a PR on an already-pushed branch ran all ten
# jobs a second time over a tree that is USUALLY the same — and merging did not stop them: on 1 Sep 2026 a
# PR-event run was still working through four WebKit jobs minutes after the PR it belonged to had
# been merged.
#
# "USUALLY the same" is the honest word (v22.32, external review — it said "identical"). A `push`
# run checks out the BRANCH HEAD; a `pull_request` run checks out the synthetic MERGE COMMIT of that
# head with the base. They are the same tree only while `main` has not moved. When it has, the
# merge-result run is the more informative of the two — it tests what merging would actually
# produce — and the group does NOT encode that preference: whichever fires later wins, which is
# ordinarily the PR `synchronize` run and therefore ordinarily the one we want.
#
# Left as it is deliberately. Encoding "merge-result beats branch-head" would mean not cancelling
# across events, i.e. paying for both suites on every push to an open PR, to protect against a base
# that moved in the seconds between two runs of the same commit. The cost is a stale-base pass that
# the deploy workflow's own gate would catch before anything shipped. Documented rather than fixed,
# so the next reader knows it was weighed.
#
# THE KEY IS `head_ref || ref_name`, AND THE FALLBACK IS THE WHOLE POINT. `github.ref` is
# `refs/heads/<branch>` on a push and `refs/pull/<n>/merge` on a pull_request, so the recipe
# everyone reaches for — `${{ github.workflow }}-${{ github.ref }}` — files the two events under
# DIFFERENT groups and cancels neither. It looks correct, it is the common form, and against this
# repo's actual duplication it does nothing. `head_ref` is the source branch on a PR and empty on
# a push; `ref_name` is the bare branch name on a push. Both land on the same string, so the two
# events finally collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── A COMMIT ALREADY ON MAIN IS NOT NEWS (1 Sep 2026) ────────────────────────────────────────
  #
  # The push trigger fires on every branch, which is right for work and wrong for a branch RESET.
  # The habit after a merge is `git checkout -B <branch> origin/main` and a force-push, so the
  # branch head becomes a commit that went green minutes ago and is now on main. That push ran the
  # whole suite again — four WebKit jobs, the Chromium smoke, csp, rules, functions, unit, visual —
  # over a tree main had already accepted. It happened on 1 Sep 2026, and it is why this job exists.
  #
  # One API call and no checkout. MEASURED on its first live run (1 Sep 2026): the job itself took
  # 2s, of which the `gh api` call was 0.7s, and the seven siblings were dispatched 4s after it —
  # so that is the cost on the critical path of a genuine run, not the ~15s first guessed here.
  # The compare endpoint answers the question directly rather than by inference: `identical` means
  # this IS main's tip, `behind` means it is an ancestor of main. Anything else — `ahead`,
  # `diverged` — is work main has not seen, which is precisely what the suite below is for.
  #
  # IT FAILS OPEN IN EVERY DIRECTION, and the asymmetry is the design. An unnecessary run costs
  # runner minutes; a wrongly-SKIPPED run reports a green suite that tested nothing, on a branch
  # somebody is about to merge — silent, and in the one direction that matters. So an API error
  # resolves to `unknown` and runs, a pull_request never consults the API at all, and every job
  # below asks `!= 'true'` rather than `== 'false'`: if this job dies outright its output is the
  # empty string, and the suite still runs.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # The context values go through `env`, not straight into the script. They are all
      # repo-controlled here, but a `${{ }}` spliced into a shell body is the shape of a script
      # injection and should not have to be re-audited to know it is safe.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "a $EVENT event is always tested"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status 2>/dev/null || echo unknown)
          echo "compare main...$SHA => $status"
          case "$status" in
            identical|behind)
              echo "this commit is already on main — nothing new to test"
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

  unit:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Deployment-hygiene tests run here (not only at deploy) so the
      # doc-checkpoint tripwire and version-consistency checks gate every
      # branch and PR — catching a missed 0.10 doc sweep before merge, not after.
      - name: Run unit and hygiene tests
        run: |
          # Canonical check command (lint + tests) lives in package.json.
          npm run check

  # ── CLOUD FUNCTIONS, ON THE RUNTIME THEY ACTUALLY RUN ON (v21.82) ──────────────────────────────
  #
  # `npm run check` above does NOT include test:functions — that command needs functions/node_modules
  # (firebase-admin, firebase-functions), which the root install does not provide. So until this job
  # existed the Functions tests ran in exactly one place: deploy-functions.yml, which triggers on a
  # push to main. A Functions regression therefore could not fail a PR. It was caught after merge,
  # with the deploy blocked — production safe, but the wrong end of the merge, and the opposite of
  # how every other suite here is gated. Found by external review, 26 Aug 2026.
  #
  # NODE 22, deliberately, and NOT the '20' every other job here pins. 22 is the deployed runtime
  # (functions/package.json `engines`). deploy-functions.yml runs on 20 for a specific and separate
  # reason — firebase-tools failed to authenticate on 22 — and that choice is about the deploy TOOL,
  # not the code under test. Left as it was, it meant the handlers were only ever tested on a
  # version they never run on. This job is where that is corrected; do not "align" it back to 20.
  functions:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      # BEFORE the tests: functions-surface.test.mjs require()s functions/index.js to pin the deploy
      # surface, and that pulls firebase-admin/firebase-functions from functions/node_modules. With
      # the install after, the pin fails on every CI run while passing on any machine that has ever
      # installed — the classic works-here gap. Same ordering as deploy-functions.yml, same reason.
      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Run functions tests (parser helpers, deploy-surface pin, overtime + auth endpoints)
        run: npm run test:functions

  # E2E smoke suite — real headless Chromium, Firebase SDK stubbed at the network
  # layer (e2e/fixtures.js) so the suite never depends on the gstatic CDN. Catches
  # blank-page failures (SyntaxError, missing import, broken module graph) that every
  # unit test passes but that would ship a broken page to staff. (It does NOT run under
  # firebase.json's CSP — the local http-server applies no headers; the `csp` job below
  # proves the CSP at runtime via the Hosting emulator, and csp-hygiene.test.mjs checks the
  # config statically.) Separate job so a smoke failure is attributable at a glance and runs
  # in parallel with unit.
  smoke:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # CI runners have no pre-installed browser, so fetch Chromium here. (The
      # Claude Code dev environment ships Chromium at /opt/pw-browsers, which is
      # why the suite is now locally runnable — see ROADMAP "E2E smoke tests".)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── SAFARI'S ENGINE (v21.28) ─────────────────────────────────────────────────────────────────
  #
  # iOS is a supported platform carrying a dozen documented Safari workarounds, and until now not
  # one of them was exercised by a browser that behaves that way. The first WebKit run found a test
  # asserting the notification bell exists unconditionally — a Chromium assumption, where the app
  # was right and the test was provincial.
  #
  # It runs HERE and not in deploy-hosting.yml on purpose: a second engine in the deploy gate would
  # double the critical path and let a WebKit-only flake keep staff on a stale version, which is the
  # failure that had production four releases behind on 14 Aug 2026.
  # ── ONE JOB PER ENGINE (v21.80), THEN SHARDED (v22.23) ─────────────────────────────────────────
  #
  # This was a single job running the whole smoke suite TWICE — desktop WebKit, then Mobile Safari —
  # sequentially, and it had become the thing every merge waited on: 18m48s of test time on the last
  # run, against five sibling jobs that finish in one to seven minutes. It was also cancelled at
  # 20m15s earlier the same day when a branch push and its PR competed for runners, and a cancelled
  # job reads exactly like a failed one.
  #
  # The matrix runs the two engines as separate jobs in parallel, so the wall clock is one engine
  # rather than both. `fail-fast: false` because the whole point is which ENGINE broke: cancelling
  # Mobile Safari the moment desktop fails would throw away the more interesting half.
  #
  # v21.78 had raised the single job's cap 20 → 35 and left a note to split it "if it ever
  # approaches 35 minutes". Waiting for that would have been the wrong trigger — the cap was never
  # the problem, the wall clock was.
  #
  # AND ONE ENGINE WAS STILL THE LONG POLE. Measured on the desktop-WebKit run at v22.23: 8m12s
  # total, of which 1m18s is setup (checkout, `npm ci`, the browser and its GTK/GStreamer libs) and
  # 6m54s is tests. The install is not the cost; the tests are. The runner has 4 vCPU and Playwright
  # defaults `workers` to half the CPUs, so two — against ~11.6 WebKit-minutes of serial work, a
  # 2-worker floor of ~5.8 min.
  #
  # So the second axis shards each engine two ways: four jobs of roughly half the tests. The wall
  # clock now falls with the RUNNER count instead of fighting for cores on one machine — which is
  # why this was chosen over raising `workers` to 4. That would nominally reach ~2.9 min on paper,
  # but this is the job carrying the documented flake history that `retries: 1` in
  # playwright.webkit.mjs exists for, and CPU contention between browser workers is a flake source.
  # A job that is intermittently red teaches everyone to stop reading it, which spends the whole
  # value of running the engine at all.
  #
  # Sharding only pays with `fullyParallel: true`, which is set in playwright.webkit.mjs and NOT in
  # the shared config: Playwright shards by test GROUP, and with that flag off a group is a whole
  # FILE, so pages.spec.js's 143 tests would pin one shard at ~4 minutes no matter how many shards
  # there are. The reasoning and the measurement behind that flag live beside it, in that file.
  #
  # THE COST, STATED: four jobs pay the ~1m18s setup instead of two, so total runner minutes go up
  # while wall clock comes down. That is the trade being made deliberately — the scarce thing here
  # is a person waiting on a merge, not runner minutes.
  webkit:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [webkit, mobile-safari]
        shard: [1, 2]
    # Each job now carries ONE engine and HALF its tests, so a quarter of the original work — 20 is
    # very generous. The cap exists to stop a hung job burning a runner for six hours, not to police
    # the suite's length, so it is deliberately not retuned every time the suite gets faster.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # `--with-deps` matters here in a way it does not for Chromium: WebKit needs a long list of
      # GTK/GStreamer libraries that no runner ships by default, and without them every test fails
      # at browser launch with an error that looks nothing like a test failure.
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run the smoke suite under WebKit
        run: npm run test:webkit -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Shard in the name too: four jobs upload here, and a colliding artifact name fails the
          # upload of whichever lands second — losing the report for the half that broke.
          name: playwright-report-webkit-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Emulator integration pack — Firestore + Storage security rules exercised against the REAL
  # emulators (npm run test:rules). This previously ran ONLY at rules-deploy time
  # (deploy-rules.yml); running it here gates every branch/PR, so a rules ↔ app contract
  # regression is caught before merge, not at deploy.
  rules:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # parity with deploy-rules.yml (silences JS-action node-version warnings)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # firebase-tools v15 requires Java 21+ for the Firestore/Storage emulators.
      - name: Install Java 21 (Firebase emulators)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # emulators:exec downloads the emulator binaries into ~/.cache/firebase/emulators on each run
      # (CI runners are ephemeral, so there is no cross-run cache unless an actions/cache step is added
      # — a possible future speed-up; the download is ~1 min and not correctness-relevant).
      - name: Run Firestore and Storage rules tests
        run: npm run test:rules

  # Deployed-CSP proof — serves the app via the Firebase Hosting emulator, which applies
  # firebase.json's real Content-Security-Policy header, then loads every page in real Chromium
  # and asserts the browser refuses nothing the app legitimately loads. This is the runtime
  # counterpart to the static csp-hygiene.test.mjs and closes the gap the http-server smoke job
  # can't (no headers). The Hosting emulator is Node-based, so no Java is needed here.
  csp:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed-CSP proof
        run: npm run test:csp
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-csp
          path: playwright-report/
          retention-days: 7

  # ── VISUAL BASELINES — REPORT-ONLY, ON PURPOSE (v21.54) ──────────────────────────────────────
  #
  # This job CANNOT fail the build (`continue-on-error`), and that is the whole design rather than
  # a hedge. Pixel output depends on the renderer: the committed baselines were generated in the
  # dev container, this runner installs its own browser on ubuntu-latest, and font hinting alone
  # will differ. A blocking job on that footing would go red for reasons nobody can act on, and the
  # reliable way to make a red build green is to stop believing it.
  #
  # WHAT IT IS FOR is the other half. The suite is opt-in, and twice in one day (v21.53) a baseline
  # was found stale — `admin-mobile-390` had been wrong since 81a0ada, a deliberate spacing change
  # that shipped without a re-baseline. A stale baseline is worse than none: it still looks like a
  # reference, so the next real regression lands inside a diff that is already large and nobody can
  # tell the new breakage from the old drift. The habit ("run it before merging a CSS change")
  # failed twice, and a habit that needs remembering is the weakest control this repo has.
  #
  # So it runs on every branch and uploads its diff images. It converts "nobody remembered" into an
  # artifact on the PR — which is detection, not enforcement, and detection is what was missing.
  #
  # THE PATH FORWARD is the one the accessibility gate already walked: it started opt-in with a
  # documented baseline, was watched until it proved stable, and became blocking at v17.52. Watch
  # this one's noise for a few weeks. If the runner's diffs are consistently empty, pin the browser
  # image, regenerate the baselines on it and promote this to blocking. If they are consistently
  # noisy, that is the answer too, and it stays report-only for good.
  visual:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      # To SAY something when a baseline drifts — see the comment step below for why the artifact
      # alone was not enough. It already existed, and went unread for eight releases.
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `|| true` as well as continue-on-error: the step's own exit code is what decides whether
      # the upload below runs, and a diff we cannot see is the one thing this job must not produce.
      # The outcome is now CAPTURED rather than only swallowed — `|| true` on its own discards the
      # one fact the comment step needs.
      - name: Compare against the committed visual baselines
        id: compare
        run: |
          if npm run test:visual; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CI: true

      # ALWAYS uploaded, pass or fail. On a clean run the artifact is near-empty and costs nothing;
      # on a drifted one it carries the expected/actual/diff triple, which is the entire point.
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore




      # ── AND IT SAYS SO WHERE SOMEBODY IS ALREADY LOOKING ──────────────────────────────────────
      #
      # The artifact above has existed as long as this job has, and a drifted baseline still went
      # unread for eight releases (v22.38 → v22.45). The job is `continue-on-error`, so the run is
      # GREEN either way, and nothing distinguishes a clean visual lane from a drifted one without
      # opening the run and downloading a zip. A signal you have to go looking for is not a signal.
      #
      # So the drift is now STATED, on the pull request. Three rules it must keep:
      #
      #   * It NEVER fails the job — every `gh` call ends `|| echo "::warning::…"`. This lane is
      #     report-only on purpose (pixel diffs are environment-sensitive and must not gate a
      #     release), and a broken notifier turning into a broken build is the worst of both.
      #   * It UPDATES one comment rather than posting per push, found by the HTML marker below. A
      #     thread of N identical comments is how a channel teaches its reader to ignore it.
      #   * It says so when the drift is GONE, so a stale "baselines drifted" cannot cry wolf — but
      #     only by EDITING a comment that already exists. A clean run on a branch that never
      #     drifted says nothing at all.
      #
      # On a `push` with no open pull request there is nowhere to comment, so it falls back to a
      # workflow annotation, which at least shows on the run itself.
      #
      # NOTE FOR ANYONE REINDENTING THIS: the Markdown inside the heredocs below sits at the run
      # block's own indentation deliberately. YAML strips exactly that, so it reaches the shell
      # flush left — which is what the Markdown needs, its fenced code block included. Indent it
      # one step further "to line up with the shell" and the fence arrives indented (a code block
      # inside a code block) and the bullets become a nested list.
      - name: Say so on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFTED: ${{ steps.compare.outputs.drifted }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          MARKER='<!-- visual-baseline-drift -->'

          # The compare step is the only thing that can answer this. If it never ran — a failed
          # install, a cancelled job — there is no outcome to report, and inventing one in either
          # direction would be worse than silence.
          if [ "${DRIFTED:-}" != "true" ] && [ "${DRIFTED:-}" != "false" ]; then
            echo "The comparison step reported no outcome — nothing to say."
            exit 0
          fi

          PR="${PR_NUMBER:-}"
          if [ -z "$PR" ]; then
            PR=$(gh pr list --head "$BRANCH" --state open --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          fi

          # WHICH baselines differ. Playwright writes one directory per failing test, each holding
          # the expected/actual/diff triple; the names are the half that belongs in a comment, and
          # a count could not answer "which ones?".
          NAMES=$(find test-results -name '*-diff.png' 2>/dev/null | sed 's#.*/##; s#-diff\.png$##' | sort -u || true)

          BODY="$RUNNER_TEMP/visual-comment.md"
          printf '%s\n\n' "$MARKER" > "$BODY"

          if [ "$DRIFTED" = "true" ]; then
            cat >> "$BODY" <<'MD'
          ### 📸 Visual baselines have drifted

          `npm run test:visual` no longer matches the committed PNGs on this branch. **This does not block
          the merge** — pixel diffs are environment-sensitive, so this lane reports and never gates. It does
          mean somebody has to look, which is the part that was missing.
          MD
            if [ -n "$NAMES" ]; then
              printf '\n%s\n\n' "Baselines that differ:" >> "$BODY"
              printf '%s\n' "$NAMES" | sed 's/^/- `/; s/$/`/' >> "$BODY"
            fi
            printf '\n%s\n\n' "The expected/actual/diff triple is in the **\`visual-diffs\`** artifact on [this run]($RUN_URL) — **it expires in 7 days**." >> "$BODY"
            cat >> "$BODY" <<'MD'
          If the change is intended, regenerate — and then review what came back:

          ```
          npm run test:visual -- --update-snapshots=all
          git status e2e/visual-baselines/
          ```

          `=all` is load-bearing (a bare `--update-snapshots` only rewrites baselines whose comparison
          FAILED, so one that drifted inside the tolerance could never be refreshed) — but it rewrites the
          ones that PASSED too. Revert anything you cannot explain and re-run: still green means it was
          rendering noise and does not belong in the diff.
          MD
          else
            cat >> "$BODY" <<'MD'
          ### 📸 Visual baselines match

          They drifted earlier on this branch; the latest run matches the committed PNGs. Nothing to do.
          MD
            printf '\n%s\n' "[Run]($RUN_URL)" >> "$BODY"
          fi

          if [ -z "$PR" ]; then
            if [ "$DRIFTED" = "true" ]; then
              echo "::warning::Visual baselines have drifted on $BRANCH, and there is no open pull request to say so on. The expected/actual/diff triple is in the visual-diffs artifact on this run."
            fi
            exit 0
          fi

          # `--paginate` runs the jq filter ONCE PER PAGE, so a filter ending `.[0].id` emits one
          # line per page — "null", "null", "123" on a busy thread. Emitting only the matches and
          # taking the first keeps it to one id or nothing at all.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | contains(\"$MARKER\")))[].id" 2>/dev/null | head -n 1 || true)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f body="$(cat "$BODY")" --silent \
              || echo "::warning::Could not update the visual-baseline comment on #$PR — see the visual-diffs artifact."
          elif [ "$DRIFTED" = "true" ]; then
            gh pr comment "$PR" --body-file "$BODY" \
              || echo "::warning::Could not comment on #$PR about the drifted visual baselines — see the visual-diffs artifact."
          fi
