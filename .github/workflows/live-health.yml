name: Is the live site up?

# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────────────────────────
#
# The installed app HIDES a broken website. It is offline-first, so a phone that already has it
# launches — and even updates — from the service-worker cache while the live site serves a splash
# that never clears, a 404, or a module the CSP refuses. A real outage went unnoticed exactly that
# way, and CLAUDE.md has asked ever since for the live URLs to be checked "occasionally, and in every
# review". `npm run test:live` (e2e/live.spec.js) made that check runnable. It still depended on
# somebody remembering to run it.
#
# `production-currency.yml` runs hourly and does NOT cover this. It asks whether the served VERSION
# matches main, by downloading `roster-data.js` — a question a stuck splash, a broken module graph
# or a 404 on `admin.html` all answer "yes, current" to, because that one file still downloads
# fine. The two workflows are deliberately separate: that one is two curls and can run every hour;
# this one is a real browser opening six pages, and every four hours is plenty for a check whose
# purpose is to notice an outage in hours rather than in the ten it took by hand.
#
# ── WHY IT DEMANDS A DIRECT CONNECTION ──────────────────────────────────────────────────────────
#
# live.spec.js has a fallback for sandboxes whose browser cannot complete TLS to the open internet:
# it fetches through curl and fulfils the requests into the page. That is honest when a person is
# reading the "mode RELAYED" line it prints. On a schedule nobody is, and a relayed run does not
# cover the two live failure modes this repo has actually been bitten by — the API-key HTTP-referrer
# restriction and a real Firebase round trip. So `LIVE_REQUIRE_DIRECT=1`: a GitHub runner's browser
# reaches the internet on its own, and a run that suddenly could not is itself a finding, not a
# reason to quietly check less.
#
# ── WHAT A FAILURE DOES ─────────────────────────────────────────────────────────────────────────
#
# A failure is a page that fails TWICE, a minute apart (6 Nov 2026, owner decision — the site step
# says why). It reports on the SAME `deploy-failure` issue thread the deploy workflows and the
# currency check use — one situation, one thread. It never deploys and never fixes: least
# privilege, observe and report. A failed notification must not bury the real failure, so that
# step never fails the job.

on:
  schedule:
    # Every four hours, at :41 — away from production-currency's :17 so the two never read the site
    # inside the same deploy window and report the same in-flight release twice.
    #
    # That is the REQUEST, not what happens. GitHub runs a schedule when it has capacity and drops
    # runs under load: from the evening of 2 Nov to the morning of 6 Nov 2026 this one ran ten
    # times in three and a half days, at irregular times — about three a day, not six. Read "the
    # next run" as hours, not four of them.
    - cron: '41 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    # ubuntu-24.04, not -latest: the visual baselines are drawn on 24.04 (e2e.yml's smoke job says why)
    runs-on: ubuntu-24.04
    # Six pages with an 8s settle each plus the browser install: measured ~4 minutes end to end, and
    # about two more when a first look fails and the site step looks again. The limit is not sized
    # for either. It is sized so the SITE STEP'S OWN limit always runs out first: every install step
    # may take its whole limit and the site step its 20, and the report and the alert still have
    # room. A job that runs out of time is CANCELLED, and a cancelled job tells nobody (the site
    # step says why that matters). This was 35, counting only the system libraries' 8 minutes:
    # `npm ci` (7 minutes, 4 Sep 2026) and a browser download on a cache miss (9–25 minutes, 7 Oct)
    # had no limits and were not counted, so a slow setup and a hanging site together ran the job
    # out first (6 Nov review). Each now has its own limit, and workflow-hygiene.test.mjs adds them up.
    # SO DOES EVERY OTHER STEP BUT THE ALERT (7 Nov review): the checkout, Node's npm cache and the
    # browser cache are downloads too, and the report upload runs between the site step and the
    # alert. Each normally takes seconds; three minutes is the outer edge, and past it the step
    # fails by name like an install would.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3

      - name: Install Node.js
        timeout-minutes: 3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # Every step that installs has a limit of its own, counted into the job's above. One that runs
      # out FAILS by name, and the alert step waits only for the site step, so a runner that could
      # not install is a red run and not an email about a site nobody opened.
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      # Browser restored from the Actions cache, keyed on the Playwright version — the reasoning is on
      # the smoke job in e2e.yml. A cache hit still installs the apt libraries, which it cannot hold.
      - name: Restore Playwright Chromium from the cache
        id: pw-cache
        timeout-minutes: 3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: npx playwright install chromium
      # The system libraries, with a time limit of their own. Why: e2e.yml's smoke job.
      - name: Install Chromium's system libraries
        timeout-minutes: 8
        uses: ./.github/actions/install-browser-deps
        with:
          browser: chromium

      # TWO LOOKS, A MINUTE APART, BEFORE ANYBODY IS TOLD (6 Nov 2026, owner decision). Three of the
      # four alerts from 6 Oct to 2 Nov were GitHub Pages answering ONE file with a 503 during ONE
      # run — 6 Oct `pages · admin`, 16 Oct and 2 Nov `pages · root` — real for that minute, gone by
      # the next run, and nothing anybody could act on. (The fourth was a runner that could not
      # install, which the alert step's own condition already keeps off the thread.) The outages
      # this check exists for — a splash that never clears, a 404, a module the CSP refuses — do not
      # fix themselves in a minute. So a failed first look is followed, SECOND_LOOK_AFTER_S later, by
      # a second look at all six pages, and only a second failure fails this step and reaches the
      # issue. A blip is not hidden: the first look's lines stay in this log, and the run carries a
      # warning that a first look failed. It is only not emailed.
      #
      # A whole second run of the suite, and deliberately not Playwright's `retries`: that re-runs a
      # page at once, inside the blip, and a page that passes on its retry is reported "flaky" in a
      # GREEN run — the softened answer playwright.live.mjs refuses to give a person running this by
      # hand. That config keeps `retries: 0`.
      #
      # ITS OWN TIME LIMIT, INSIDE THE JOB'S. A page may take its whole test timeout (150s) to fail,
      # so one look at a site that hangs every page can take 15 minutes, and a second look on top
      # would outlast a job limit. There GitHub CANCELS the job, a cancelled job skips every step
      # that waits for a failure, and the alert never runs — the worst outage would be the one
      # reported least. A STEP that runs out of time instead FAILS by name, and the steps after it
      # that wait for a failure still run: the 23 Oct 2026 install timeout was recorded exactly that
      # way. So a site that hangs is reported when this limit runs out, in whichever look it is.
      - name: Open the live site on both origins
        id: site
        timeout-minutes: 20
        shell: bash
        run: |
          if npm run test:live; then exit 0; fi
          echo "::warning::The first look at the live site failed (its lines are above). Looking again in ${SECOND_LOOK_AFTER_S}s; only a second failure is reported."
          sleep "$SECOND_LOOK_AFTER_S"
          if npm run test:live; then
            echo "::notice::The second look passed. Whatever failed had cleared within ${SECOND_LOOK_AFTER_S}s, so nothing was reported."
            exit 0
          fi
          exit 1
        env:
          CI: true
          # A run that would have to relay must fail — see the header.
          LIVE_REQUIRE_DIRECT: '1'
          # The pause between the looks. Long enough to outlast a CDN hiccup, short enough that a
          # real outage is reported a couple of minutes later than before, not an hour.
          SECOND_LOOK_AFTER_S: '60'

      # test-results/, NOT playwright-report/ (10 Nov 2026 review): playwright.live.mjs reports to
      # the log only, so no html report is ever written, and the upload found nothing. The trace
      # `retain-on-failure` keeps for the failing page is in test-results/, and went with the runner.
      - name: Upload the failing pages' traces
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-health-test-results
          path: test-results/
          retention-days: 7

      # ONLY WHEN THE SITE CHECK ITSELF FAILED (whole-app review, Oct 2026). `failure()` alone also
      # fired when an INSTALL step died — a runner that could not fetch a library posted "The live
      # site failed its health check" on the thread staff-facing outages are reported on, about a
      # site nobody had opened. A check that could not run is a red run, which GitHub already
      # emails; it is not a finding about the site.
      - name: Say so, once, in an issue
        if: failure() && steps.site.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          LABEL="deploy-failure"

          # DEDUPED onto the existing label, so an outage, the failed deploy that caused it and the
          # stale-version report are ONE thread rather than three. A run of four-hourly failures is
          # one situation; N issues is how a channel teaches its reader to ignore it.
          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 --json number \
            --jq '.[0].number' 2>/dev/null || true)

          BODY=$(printf '%s\n' \
          "**The live site failed its health check.**" \
          "" \
          "A real browser on a GitHub runner opened the app on both origins — root, \`admin.html\`" \
          "and \`paycalc.html\` — and at least one page was not served, kept its splash up, rendered" \
          "nothing usable, or logged a console error. It looked again a minute later and the site" \
          "was still failing, so this is not a one-off blip. The run says which:" \
          "" \
          "${RUN_URL}" \
          "" \
          "### Checking your own phone will not show this" \
          "" \
          "The app is offline-first: an installed phone keeps launching from its service-worker" \
          "cache and looks perfectly healthy. CLAUDE.md → *\"The installed PWA masks live-site" \
          "breakage\"*." \
          "" \
          "### Where to look" \
          "" \
          "1. The run's log names the page and the mode. \`LIVE_REQUIRE_DIRECT\` failing on its own" \
          "   means the runner's browser could not reach the site at all — a TLS or DNS answer, not" \
          "   an app one." \
          "2. A stuck splash or a console error on ONE origin points at that origin: a Hosting" \
          "   release for \`web.app\`, the Pages build for \`github.io\`." \
          "3. Both origins failing the same way is the app itself — the last merge to \`main\`, or the" \
          "   GCP API-key referrer allowlist (KNOWN_LIMITATIONS.md task #1)." \
          "4. Re-run this workflow from the Actions tab once it is fixed; close this when it is green.")

          # Never fails the job: this step only runs when something has already gone wrong, and a
          # failed notification must not bury the real error under a second one.
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "$BODY" \
              || echo "::warning::could not comment on issue #${EXISTING}"
          else
            gh issue create --title "⚠️ The live site is failing its health check" \
              --label "$LABEL" --body "$BODY" \
              || echo "::warning::could not open the live-site issue"
          fi
