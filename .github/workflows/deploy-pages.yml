name: Deploy to GitHub Pages (staff site)

# Publishes the PWA to the staff-facing GitHub Pages site at
# https://garethdavidmiller.github.io — the user/org site, which is served from
# a SEPARATE repository (Garethdavidmiller/garethdavidmiller.github.io). This
# workflow lives in roster-app and pushes the built assets across to that repo,
# so the staff URL updates automatically on every push to main and never drifts.
#
# ── ONE-TIME SETUP (required before this can run) ──────────────────────────
#   1. Create a token that can write to the OTHER repo:
#        GitHub → Settings → Developer settings → Personal access tokens →
#        Fine-grained tokens → Generate new token
#          • Resource owner: Garethdavidmiller
#          • Repository access: Only select repositories → garethdavidmiller.github.io
#          • Permissions: Contents = Read and write
#   2. Add it to THIS repo as a secret named PAGES_DEPLOY_TOKEN:
#        roster-app → Settings → Secrets and variables → Actions → New repository secret
#   3. In the garethdavidmiller.github.io repo:
#        Settings → Pages → Build and deployment → Source = "Deploy from a branch"
#          • Branch: gh-pages   • Folder: / (root)   → Save
#      (If GitHub won't let a user site serve from gh-pages, change
#       `publish_branch` below to `main` — note that will replace that repo's
#       main branch with the built site, which is fine if it only holds the app.)
#
# The Firebase API key referrer allowlist already includes
# garethdavidmiller.github.io/* (see CLAUDE.md), so Firebase Auth/Firestore work
# there with no extra change.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

# Don't let two overlapping pushes race to publish; the latest wins.
concurrency:
  group: pages-staff-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build gate — never publish a broken build to staff. Syntax-checks every
      # root JS module (loop, so the list never goes stale) and runs the suite.
      - name: Syntax check and tests
        run: |
          for f in *.js; do echo "check $f"; node --check "$f" || exit 1; done
          # Grouped exactly like the other workflows — a flat `--test *.test.mjs` runs
          # module-parse.test.mjs without --experimental-vm-modules, silently skipping it.
          node --test sw-asset-check.test.mjs links-design.test.mjs admin-rangepicker.test.mjs
          node --experimental-vm-modules --test module-parse.test.mjs
          node --experimental-test-module-mocks --test roster-data.test.mjs paycalc.test.mjs paycalc-roster-suggestions.test.mjs roster-parse-helpers.test.mjs app.test.mjs

      # Assemble the publish folder: everything the app needs at runtime, minus
      # server-only files, docs, tests and dev tooling. Mirrors firebase.json's
      # ignore intent — but deliberately KEEPS purify.es.mjs (it's *.mjs but not
      # a *.test.mjs, so the test exclude leaves it in; the Huddle viewer needs it).
      - name: Assemble site (runtime assets only)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'functions' \
            --exclude 'example-payslips' \
            --exclude 'node_modules' \
            --exclude '*.md' \
            --exclude '*.test.mjs' \
            --exclude 'generate-sri.mjs' \
            --exclude '*.zip' \
            --exclude '*.pdf' \
            --exclude '*.jpg' \
            --exclude '*.jpeg' \
            --exclude 'firebase.json' \
            --exclude 'firestore.rules' \
            --exclude 'storage.rules' \
            --exclude 'firestore.indexes.json' \
            --exclude 'package.json' \
            --exclude 'package-lock.json'

      - name: Publish to staff GitHub Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: Garethdavidmiller/garethdavidmiller.github.io
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true          # single clean commit — no build history pile-up
          commit_message: "Deploy ${{ github.sha }} from roster-app"
