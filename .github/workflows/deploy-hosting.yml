name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'functions/**'
      - 'firestore.rules'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check and unit tests
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          # Canonical check command (lint + tests) lives in package.json.
          npm run check

      # Gate the deploy on the E2E smoke suite. The app is offline-first, so a
      # blank-page break (SyntaxError, missing import, CSP violation) is invisible
      # to already-installed phones — the only thing that catches it before staff
      # do is a real-browser page-load test. Do not deploy if smoke fails.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account; the action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which the Firebase CLI picks up automatically. Migrated after deploy-rules.yml
      # proved WIF in production. See SECURITY_RELEASE_PLAN.md → Appendix A2.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --project myb-roster
