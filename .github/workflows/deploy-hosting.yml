name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check and unit tests
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          # Canonical check command (lint + tests) lives in package.json.
          npm run check

      # Gate the deploy on the E2E smoke suite. The app is offline-first, so a
      # blank-page break (SyntaxError, missing import, broken module graph) is invisible
      # to already-installed phones — the only thing that catches it before staff
      # do is a real-browser page-load test. (This does NOT exercise the production CSP —
      # the local server applies no firebase.json headers; csp-hygiene.test.mjs checks the
      # CSP config statically.) Do not deploy if smoke fails.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          CI: true

      # Deployed-CSP proof (added after the v18.55 review's deployment-assurance gap). The smoke
      # suite above runs against a header-less http-server, so it can NOT catch a Content-Security-
      # Policy that blocks something the app loads. test:csp serves the app through the Firebase
      # Hosting EMULATOR (a local `demo-` project — no GCloud auth) so the REAL firebase.json CSP
      # header is applied + enforced by Chromium, and asserts no page triggers a policy violation.
      # This gates every deploy — the branch/PR e2e.yml `csp` job ignores pushes to main, so without
      # this a direct-to-main push or manual dispatch could ship a CSP that the post-deploy curl
      # health check (which can't see browser CSP blocking) would pass right over.
      - name: Run deployed-CSP proof
        run: npm run test:csp
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account; the action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which the Firebase CLI picks up automatically. Migrated after deploy-rules.yml
      # proved WIF in production. See SECURITY_RELEASE_PLAN.md → Appendix A2.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --project myb-roster

      # Post-deploy live-URL health check. The pre-deploy smoke/CSP gates run against a local
      # server / emulator, NOT the live site with its real CSP header + API-key referrer allowlist,
      # so a live-only breakage (missing referrer domain, bad firebase.json header, Hosting hiccup)
      # would otherwise ship green and stay invisible — the app is offline-first, so every already-
      # installed phone keeps loading from cache while a fresh visitor gets a dead site. This is the
      # exact outage that once went unnoticed (Firebase stuck on splash + Pages 404). Fetches the
      # LIVE origin and asserts it serves the just-deployed APP_VERSION, not just any 200.
      - name: Verify live site (post-deploy health check)
        run: |
          set -uo pipefail
          VERSION=$(grep -oE "APP_VERSION = '[^']+'" roster-data.js | grep -oE "[0-9]+\.[0-9]+")
          echo "Expecting APP_VERSION $VERSION live on myb-roster.web.app"
          ok=false
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/root.html -w '%{http_code}' https://myb-roster.web.app/ || echo 000)
            curl -sS -o /tmp/rd.js https://myb-roster.web.app/roster-data.js || true
            # grep the downloaded FILES (not a `printf "$live" | grep -q` pipe): under `set -o pipefail`,
            # grep -q exits on first match and closes the pipe, so printf takes SIGPIPE (141) once the
            # file exceeds the ~64KB pipe buffer, and pipefail reports the whole pipeline as FAILED — a
            # false negative that fired on the real deploy EXACTLY when the version DID match (the check
            # was only ever "green" when the site was actually stale/broken). File greps have no pipe.
            if [ "$code" = "200" ] && grep -q "Marylebone Roster" /tmp/root.html && grep -q "APP_VERSION = '$VERSION'" /tmp/rd.js; then
              ok=true; break
            fi
            echo "Attempt $i: http=$code, v$VERSION not yet live — retrying in 10s"; sleep 10
          done
          if [ "$ok" != true ]; then
            echo "::error::Live health check FAILED — myb-roster.web.app did not serve v$VERSION (root+roster-data.js)."
            exit 1
          fi
          echo "OK: myb-roster.web.app serving v$VERSION"
          # A deep-link (not just root) must also load — the documented Pages-404 class hit sub-pages.
          sub=$(curl -sS -o /dev/null -w '%{http_code}' https://myb-roster.web.app/paycalc.html || echo 000)
          if [ "$sub" != "200" ]; then echo "::error::paycalc.html returned $sub"; exit 1; fi
          echo "OK: paycalc.html deep-link 200"
          # GitHub Pages staff mirror: liveness only. It builds independently of this workflow, so its
          # version can briefly lag a Firebase deploy — a hard version-match would flake. Warn only.
          mcode=$(curl -sS -o /dev/null -w '%{http_code}' https://garethdavidmiller.github.io/roster-app/ || echo 000)
          if [ "$mcode" = "200" ]; then echo "OK: Pages mirror live (200)"; else echo "::warning::Pages mirror returned $mcode — check the mirror build"; fi

  # ── AND A FAILURE BEFORE THE FIRST STEP MUST NOT BE SILENT EITHER ───────────────────────────
  #
  # The reporter used to be the deploy job's own last step, guarded by `if: failure()`, and its
  # comment claimed that covered "EVERY step above". True, and not the whole surface: a step-level
  # guard cannot run when NO step runs. On 14 Aug 2026 this workflow failed in `Prepare all
  # required actions` — codeload would not serve the pinned `actions/setup-java` — so the job died
  # during setup, every step including the reporter was skipped, and the deploy failed in exactly
  # the silence the reporter exists to prevent. It was found by hand, days later.
  #
  # A SEPARATE JOB closes that: `needs` + a job-level `if: failure()` fires when the deploy job
  # fails for ANY reason, setup included. It REPLACES the in-job step rather than joining it —
  # two reporters on one failure would comment twice on the same issue, and a notification
  # channel that repeats itself is one people stop reading.
  #
  # The irreducible tail: this job needs `checkout` and the action itself, so a codeload outage
  # broad enough to take those down takes the reporter with it. Nothing inside a workflow can
  # report that. It is a far smaller target than the four actions the deploy job pulls.
  report-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/report-deploy-failure
        with:
          target: 'Firebase Hosting'
          token: ${{ github.token }}
