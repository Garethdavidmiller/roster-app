name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - '**/*.md'
      - '.github/**'
      - '.git/**'
      # Session tooling — skills, rules, hooks. It cannot reach the served app, and since 8 Sep
      # 2026 firebase.json excludes it from the bundle too, so a deploy triggered by a change in
      # here would republish an identical tree. That is not merely wasted: the concurrency group
      # below QUEUES rather than cancels, so a no-op deploy lands IN FRONT of the next real one
      # and delays it by the length of a full run. `paths-ignore` only skips when EVERY changed
      # path matches, so a commit touching both this and a served file still deploys.
      - '.claude/**'
      # The documentation estate, for the same reason (9 Sep 2026, external review). `**/*.md`
      # above already covered nearly all of it — but `docs/proposals/` (later `docs/links-24/`, removed 7 Nov 2026) had acquired 25 files that
      # are not markdown: the December proposal designs as `.json`, their paste-ready `.txt`
      # imports, and `tooling/*.mjs` with its `results/*.json`. Those were eligible to be SERVED,
      # and a change to one of them triggered a deploy of a tree no member can see a difference in.
      - 'docs/**'
      # The unit tests, for the same reason again (23 Oct 2026). firebase.json keeps every `*.test.mjs`
      # out of the bundle, yet a change to one still started a deploy: #1625 touched only workflows,
      # docs and workflow-hygiene.test.mjs, and its merge spent an 18-minute run republishing v24.91
      # byte for byte.
      - '**/*.test.mjs'
      # And, from the same day, THE REST OF firebase.json's hosting.ignore, so the two lists stop
      # drifting: whatever the bundle leaves out, a change to it alone does not deploy. This job
      # publishes the repository as it stands and builds nothing from any of these. A few name
      # files that are not normally committed at all (test output, archives, images, example
      # payslips); they are here because one rule is easier to check than a list of exceptions.
      # hosting-ignore-parity.test.mjs holds the two lists together, and names the only entries
      # left out on purpose: firebase.json, which IS the hosting config and always deploys, and
      # `**/.*` and `**/node_modules/**`, the two patterns GitHub might read differently from
      # Firebase. One cost to know: a firebase-tools bump in package.json now waits for the next
      # real release — run this workflow by hand (workflow_dispatch) to deploy with it sooner.
      - 'generate-sri.mjs'
      - '**/*.zip'
      - 'example-payslips/**'
      - '**/*.pdf'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'playwright.csp.mjs'
      - 'playwright.visual.mjs'
      - 'playwright.visual-webkit.mjs'
      - 'playwright.offline.mjs'
      - 'playwright.live.mjs'
      - 'playwright.webkit.mjs'
      - 'e2e/**'
      - 'experiments/**'
      - 'test-fixtures/**'
      - 'playwright-report/**'
      - 'test-results/**'
      - 'scripts/**'
      - 'githooks/**'
      - 'eslint.config.js'
      - 'jsconfig.json'
  workflow_dispatch:

# ── ONE DEPLOY AT A TIME, AND THE NEWEST ONE LAST (1 Sep 2026) ─────────────────────────────────
#
# Two pushes to main in quick succession used to run two deploys in parallel, each spending ~11
# minutes on tests before releasing. Nothing orders them, so if the FIRST push's tests happen to
# run slower it releases second — and main's older tree is what staff get, with both runs green
# and nothing anywhere saying so. The window is not theoretical: this workflow takes 11m33s.
#
# `cancel-in-progress: false` IS THE WHOLE POINT, and it is the opposite of the setting on
# e2e.yml. Cancelling a superseded TEST run throws away work nobody wanted; cancelling a
# superseded DEPLOY interrupts one mid-flight. So this queues: the second run waits for the first
# to finish completely, then runs its own tests against its own tree and releases after it. The
# cost is real and is the point — the later push waits ~11 minutes longer, and in exchange the
# thing that is live is always the last tree to arrive.
#
# GitHub holds at most ONE pending run per group, so a third push displaces the queued second
# rather than stacking behind it. That is the behaviour to want: the displaced run's commits are
# already contained in the one that replaced it, and what deploys is main's tip. That holds for
# PUSHES (10 Nov 2026 review). A re-run of an old run, or a run started from another branch, also
# joins the queue and can displace a waiting push without containing it: the re-run check at the
# top of the deploy job and the `not-main` job deal with one each.
#
# THE GROUP IS DELIBERATELY REF-INDEPENDENT. There is one Firebase project, so two deploys racing
# is a hazard no matter which ref they came from — and `workflow_dispatch` above carries no branch
# restriction, so a manual dispatch from a branch could otherwise run straight into a main deploy.
# Keying on `github.ref` would read as more precise and would reintroduce exactly that case.
#
# It is keyed per WORKFLOW, not one shared "deploy" group. The three deploy workflows are designed
# to fire in parallel from one push (they touch different targets, and CLAUDE.md's ordering note
# depends on it); a shared group would serialise every release for no safety gain.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── THE GATE RUNS AS PARALLEL JOBS, AND THE DEPLOY WAITS FOR EVERY ONE (10 Nov 2026) ───────────
  #
  # The tests and the upload were one job, so the two Chrome projects ran one after the other on a
  # single runner: 35m18s and 34m07s of tests inside v25.68's and v25.69's 38m24s and 37m10s deploys,
  # near enough to the job's 40-minute limit that #1737 doubled it. They now run as jobs of their
  # own, side by side, as e2e.yml's pull-request checks have since 3 Nov 2026, where the same two
  # halves took 16 to 18 minutes each on 10 Nov 2026:
  #
  #     tested ─► (each gate job below but `safari` stands aside when it proves the tree; its comment says how)
  #     check ──────────────────────────┐
  #     smoke (chromium, 1/3 … 3/3) ────┤
  #     smoke (mobile-chrome, 1/3 … 3/3) ┼──► deploy ──► the Pages mirror (deploy-mirror.yml)
  #     csp ────────────────────────────┤
  #     signed-in ──────────────────────┤   (since 12 Nov 2026; Android Chrome — its own comment says why)
  #     safari ─────────────────────────┘   (since 17 Nov 2026; the iPhone's engine — its own comment says what)
  #
  # A release now waits for the slowest job instead of the sum. Three things keep it the same gate,
  # and workflow-hygiene.test.mjs holds each one:
  #   1. `deploy` NEEDS EVERY GATE JOB, and its `if:` lets it run only when every one of them
  #      SUCCEEDED, or when `tested` (below) found this exact tree already passed the same gate on a
  #      pull request: one gate job red, cancelled or skipped without that, and nothing is uploaded.
  #      `safari` must succeed either way: the pull request's record covers no WebKit check but the
  #      iPhone's signed-in half, so the proof cannot stand in for it. Needing `smoke` waits for
  #      every shard of it.
  #   2. THE SMOKE LIST NAMES EXACTLY playwright.config.mjs's PROJECTS, AND EVERY SHARD OF EACH, and
  #      it is e2e.yml's list. `npm run test:e2e` read the project list for itself; a project or a
  #      shard now missing would never gate a release, and a list that differed from the PR lane's
  #      would let a PR go green on a suite run differently from the one that gates the deploy.
  #   3. `report-failure` NEEDS EVERY JOB, not only `deploy`. A gate job that runs out of time ends
  #      CANCELLED and leaves `deploy` SKIPPED; `failure()` is false for both, and the cancelled check
  #      reads only the jobs it lists, so a reporter waiting on `deploy` alone would say nothing.
  #
  # Only `deploy` can sign in to Google (`id-token: write`), and GitHub hands every step of that job
  # the means to ask for the credential, so it runs no test and no dependency's install script: it
  # installs with `npm ci --ignore-scripts` (17 Nov 2026; until then a plain `npm ci` ran every install
  # script there, and this comment said otherwise). What runs in it is the pinned actions, this
  # repository's re-run, upload and live checks, and firebase-tools itself. The gate jobs hold a
  # read-only token and keep it off the disk. deploy-functions.yml and deploy-rules.yml have the same
  # shape, and the first of them records what was measured to show firebase-tools works without its
  # dependencies' install scripts. Every job runs only from main, for the reason given on `deploy`.
  #
  # ── A TREE THE PULL REQUEST ALREADY TESTED IS NOT TESTED AGAIN (17 Nov 2026) ──────────────────
  #
  # `main` squash-merges, and a pull request whose branch is up to date with main merges into
  # EXACTLY the tree its last Tests run checked out: same files, byte for byte, so the same tree
  # hash. Running check, smoke, csp and signed-in again on it repeated about ten minutes of work
  # whose answer was already known, on every release.
  #
  # e2e.yml's `tested` job records the tree of every run whose `unit`, `smoke`, `csp` and
  # `signed-in` all SUCCEEDED, as an artifact named after the tree (tested-tree-<hash>, kept 7
  # days). Those are this gate's four jobs, run there the same way (workflow-hygiene.test.mjs holds
  # the shard lists equal; e2e.yml's `signed-in` runs this one's Android half and the iPhone too).
  # `tested` here asks whether main's new tree has such a record. If it has, the four gate jobs
  # stand aside and the deploy goes ahead on that proof; if it has not — main moved after the PR's
  # run, a branch was behind, a run was red, the record expired, the API did not answer — they run
  # exactly as before. It can only ever SKIP work on a tree already proven, never pass one that
  # was not.
  #
  # WHAT COUNTS AS PROOF. Only a record made by .github/workflows/e2e.yml, in a run of THIS
  # repository (a fork's pull request runs here too, and could upload an artifact by any name it
  # liked). A push only: a run started by hand runs the whole gate, because whoever starts one is
  # usually asking for exactly that.
  tested:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read     # lists artifacts, and reads the run that made one
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tested=false
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)
          if [ "$EVENT" = "push" ] && printf '%s' "$tree" | grep -qxE '[0-9a-f]{40}'; then
            echo "main's tree is $tree"
            runs=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree&per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' 2>/dev/null || true)
            for run in $runs; do
              made=$(gh api "repos/$REPO/actions/runs/$run" --jq '.path + " " + .head_repository.full_name' 2>/dev/null || true)
              if [ "$made" = ".github/workflows/e2e.yml $REPO" ]; then
                echo "run $run of e2e.yml passed this gate's jobs on this exact tree — they stand aside"
                tested=true
                break
              fi
            done
          fi
          if [ "$tested" != true ]; then echo "no proof for this tree — the gate runs in full"; fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  check:
    needs: tested
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    # The same command, setup and limit as e2e.yml's `unit` job (1.6 minutes on 10 Nov 2026; 15, from
    # 10, since both install functions/ too for the typecheck — 25 Nov 2026).
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # No token left on disk (whole-app review, 10 Nov 2026): every dependency's install script runs
      # in this job, and nothing here needs git credentials. The same holds for every job below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # THE GATE RUNS ON THE PR LANES' NODE — 24 since v25.30 (48-hour review). The PR lanes moved to
      # 22 on 26 Sep 2026 while this gate kept testing on 20, so a suite green on 22 and red on 20
      # passed the PR and failed only here, after the merge — the exact split e2e.yml's comment says
      # it removed. firebase-tools stepped back to 20 for its sign-in until 3 Nov 2026; every job here
      # runs on one Node now (deploy-functions.yml has the history).
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Functions' types, for the typecheck inside `npm run check` — e2e.yml's `unit` job says why.
      - name: Install function dependencies (for their types)
        run: npm ci --ignore-scripts
        working-directory: functions

      # No separate `node --check` loop (removed at the v24.28 review): `npm run check` runs
      # test:parse, whose module-parse.test.mjs parses every root .js (the same set `*.js` named)
      # under the ES-module goal browsers use — the stronger of the two checks, already in this step.
      - name: Syntax check and unit tests
        run: |
          # Canonical check command (lint + tests) lives in package.json.
          npm run check

  smoke:
    needs: tested
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tested.outputs.tested != 'true' }}
    # ubuntu-24.04, not -latest: the visual baselines are drawn on 24.04 (e2e.yml's smoke job says why)
    runs-on: ubuntu-24.04
    # Desktop Chrome in three shards and the Pixel in two, on four workers, as in e2e.yml's smoke job,
    # which has the account and the measurements (25 Nov 2026): about 6 to 7.5 minutes a shard, against
    # 15 to 17 for a whole project on two workers, which was the longest wait in every release. Each job runs only its own shard, so the
    # list must name every project in playwright.config.mjs and every shard of each, and it must be
    # e2e.yml's list exactly; workflow-hygiene.test.mjs holds all three. `fail-fast: false` so a red
    # shard never cancels the others and loses its report.
    name: smoke (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 3, weights: '609:619:681' }
          - { project: chromium, shard: 2, shards: 3, weights: '609:619:681' }
          - { project: chromium, shard: 3, shards: 3, weights: '609:619:681' }
          - { project: mobile-chrome, shard: 1, shards: 2, weights: '918:991' }
          - { project: mobile-chrome, shard: 2, shards: 2, weights: '918:991' }
    # THE LIMIT FOLLOWS THE RUN. While the tests shared one job with the upload, it went 20 → 40 on
    # 2 Oct 2026: v24.43 released at 20m11s, and v24.44 was CANCELLED at exactly 20m00s — smoke alone
    # took 17m14s, so the clock ran out inside the CSP proof, before the deploy step, and production
    # stayed on the previous version with every test green. Nothing failed; the hourly currency check
    # was the only thing that noticed. Then 40 → 80 on 10 Nov 2026 (#1737), after a 38m24s run. A
    # limit here is a stuck-job guard, not a performance budget, set at about twice a normal run: each
    # half took 16 to 18 minutes in e2e.yml on 10 Nov 2026, so 40. Sharded on 12 Nov 2026, a job is
    # about 8 minutes with its setup; 40 is left as it was, because a cancelled gate keeps production
    # on the previous version, and a shard on a slow runner behind the libraries' own 8-minute
    # ceiling still fits several times over.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the E2E smoke suite. The app is offline-first, so a
      # blank-page break (SyntaxError, missing import, broken module graph) is invisible
      # to already-installed phones — the only thing that catches it before staff
      # do is a real-browser page-load test. (This does NOT exercise the production CSP —
      # the local server applies no firebase.json headers; csp-hygiene.test.mjs checks the
      # CSP config statically, and the csp job below enforces it in a browser.)
      # Browser restored from the Actions cache, keyed on the Playwright version — the reasoning is on
      # the smoke job in e2e.yml. The apt libraries, which the cache cannot hold, install on every run
      # with a time limit of their own (reason in the same place): a stalled mirror here would otherwise
      # hold up the release for the job's whole time limit.
      - name: Restore Playwright Chromium from the cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The system libraries, with a time limit of their own. Why: e2e.yml's smoke job.
      - name: Install Chromium's system libraries
        timeout-minutes: 8
        uses: ./.github/actions/install-browser-deps
        with:
          browser: chromium

      - name: Run smoke tests
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=4
        env:
          CI: true
          # Where the cut falls: the entry's `weights` (e2e.yml's smoke job says why and how they were measured).
          PWTEST_SHARD_WEIGHTS: ${{ matrix.weights }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The project AND the shard in the name: five jobs upload here, and a colliding artifact name
          # fails the upload of whichever lands second — losing the report for the shard that broke.
          name: playwright-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  csp:
    needs: tested
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    # The same command, setup and limit as e2e.yml's `csp` job (1.4 minutes on 10 Nov 2026).
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright Chromium from the cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium's system libraries
        timeout-minutes: 8
        uses: ./.github/actions/install-browser-deps
        with:
          browser: chromium

      # Deployed-CSP proof (added after the v18.55 review's deployment-assurance gap). The smoke
      # suite runs against a header-less http-server, so it can NOT catch a Content-Security-
      # Policy that blocks something the app loads. test:csp serves the app through the Firebase
      # Hosting EMULATOR (a local `demo-` project — no GCloud auth) so the REAL firebase.json CSP
      # header is applied + enforced by Chromium, and asserts no page triggers a policy violation.
      # This gates every deploy — the branch/PR e2e.yml `csp` job ignores pushes to main, so without
      # this a direct-to-main push or manual dispatch could ship a CSP that the post-deploy curl
      # health check (which can't see browser CSP blocking) would pass right over.
      - name: Run deployed-CSP proof
        run: npm run test:csp
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-csp
          path: playwright-report/
          retention-days: 7

  # ── THE SIGNED-IN JOURNEYS, ON THE TREE BEING RELEASED (12 Nov 2026) ───────────────────────────
  #
  # Every other job here swaps the Firebase SDK for a stub. This one runs the app's REAL SDK against
  # the Auth, Firestore and Functions emulators, under the real rules and the real functions — the
  # journeys are listed on e2e.yml's `signed-in` job — so it is the one gate job that would stop a
  # release whose sign-in, save or data load works only against the stub. That job ran in branch CI
  # alone from 11 Nov 2026; this one joined the gate the next day, asked for by the external review of
  # v25.87, on a record of 28 completed runs, every one green and none re-run.
  #
  # ANDROID CHROME HERE (`--project=mobile-chrome`). The lane's iPhone half joined the gate on 17 Nov
  # 2026 in the `safari` job below, with the gate's other WebKit check, so each job installs one browser
  # and neither engine waits for the other. workflow-hygiene.test.mjs holds the split, and fails if
  # WebKit runs in any gate job but `safari`.
  #
  # What it costs is not time — about three minutes, beside the smoke shards' five to eight — but one
  # more way for a release to be held: red here, and nothing is uploaded, as for any gate job. The Rules
  # and Functions deploys keep their own suites (test:rules, test:functions) and do not run it.
  signed-in:
    needs: tested
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    # The test step carries the budget; this is the backstop: two installs, Java, the browser's system
    # libraries on a slow mirror (8 minutes at worst, the smoke job in e2e.yml says why) and the tests.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # The Firestore emulator is a Java program.
      - name: Install Java 21 (Firebase emulators)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      # The Functions emulator loads the real functions, so their packages must be installed.
      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      # One engine, so the cache entry the smoke job uses.
      - name: Restore Playwright Chromium from the cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium's system libraries
        timeout-minutes: 8
        uses: ./.github/actions/install-browser-deps
        with:
          browser: chromium

      - name: Run the signed-in journeys on Android Chrome
        timeout-minutes: 15
        run: npm run test:signed-in -- --project=mobile-chrome
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-signed-in
          path: playwright-report/
          retention-days: 7

  # ── SAFARI'S ENGINE, ON THE TREE BEING RELEASED (owner, 17 Nov 2026) ───────────────────────────
  #
  # The app serves iPhone and Android equally, yet until now a release was tested on Chrome alone:
  # the WebKit suite ran on every branch, never on main after the merge, so two changes that were
  # each green on their branch could still ship a page Safari will not start. This job runs two
  # small sets on the iPhone's engine (WebKit at iPhone size), and the deploy waits for both:
  #   1. EVERY PAGE OPENS (e2e/every-page.spec.js): each app page, guide and old address, past its boot
  #      with nothing thrown. Its pages come from scripts/app-pages.mjs, so a new page joins by itself.
  #   2. THE SIGNED-IN JOURNEYS' IPHONE HALF: the `signed-in` job's journeys, through the real SDK,
  #      rules and functions on the emulators. 90 branch runs in a row green when it joined.
  # NOT the whole WebKit suite: in branch CI that is nine jobs, the longest over twenty minutes, and
  # every release would wait for it (DECISIONS.md → "A few Safari tests gate the release" has what was
  # weighed). On the first release that ran it (v26.31, 18 Nov 2026) this job took 3m 57s with its
  # setup (every page 19 seconds, the journeys 2m 36s), against 9m 36s for the slowest smoke shard in
  # the release of 17 Nov 2026: a release waits no longer than it did.
  #
  # IT NEVER STANDS ASIDE FOR A PROVEN TREE (18 Nov 2026). `tested` lets check, smoke, csp and
  # signed-in stand aside when a pull request already passed them on this exact tree, but its record
  # covers no WebKit check except signed-in's iPhone half: on a pull request the WebKit suite gates
  # nothing, so a tree whose WebKit jobs were red still carries the proof. So this job runs on every
  # release and `deploy` waits for it either way; a proven release then waits for this job alone.
  #
  # Every page first: it is the quick one, and a page that cannot start would fail the journeys
  # too, less clearly. A red step stops the job, so the report uploaded is the failing step's.
  # workflow-hygiene.test.mjs holds the two commands, the spec's name, and that WebKit runs in no other
  # gate job. One cost to know: a test added to every-page.spec.js gates every release from then on.
  safari:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The test steps carry their budgets; this is the backstop: two installs, Java, WebKit's system
    # libraries on a slow mirror (8 minutes at worst, e2e.yml's smoke job says why) and both test steps.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # The Firestore emulator is a Java program (the signed-in journeys).
      - name: Install Java 21 (Firebase emulators)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      # The Functions emulator loads the real functions, so their packages must be installed.
      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      # One engine, so the cache entry e2e.yml's webkit jobs use.
      - name: Restore Playwright WebKit from the cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - name: Install Playwright WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - name: Install WebKit's system libraries
        timeout-minutes: 8
        uses: ./.github/actions/install-browser-deps
        with:
          browser: webkit

      - name: Every page opens on the iPhone's engine
        timeout-minutes: 10
        run: npm run test:webkit -- --project=mobile-safari e2e/every-page.spec.js
        env:
          CI: true

      - name: Run the signed-in journeys on the iPhone's engine
        timeout-minutes: 15
        run: npm run test:signed-in -- --project=mobile-safari
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-safari
          path: playwright-report/
          retention-days: 7

  deploy:
    # The whole gate above. The `if:` below runs this job only when every gate job SUCCEEDED, or when
    # `tested` proved this tree already passed them on a pull request (its comment says how): one gate
    # job red, cancelled or skipped without that proof, and this job does not run. `safari` is the one
    # it never stands in for: no pull request's record covers it, so it runs on every release and must
    # succeed either way (its own comment says why). It names each result rather than leaning on the
    # implicit `success()`, because that would also stop it when the gate jobs stood aside for a
    # proven tree. `!cancelled()` keeps a cancelled run from deploying.
    needs: [tested, check, smoke, csp, signed-in, safari]
    # ── PRODUCTION DEPLOYS ONLY EVER RUN FROM `main` (v22.32, external review) ─────────────────
    #
    # `workflow_dispatch` above carries no branch restriction, and the concurrency group above
    # QUEUES rather than cancels — but GitHub keeps only ONE pending run per group, so a newer
    # pending run displaces the previous one. That is safe for consecutive pushes to main, where
    # the later tree contains the earlier one. It is NOT safe across branches:
    #
    #     main A deploying → main B pending → someone dispatches branch C → B is displaced
    #                                       → production finishes on C, not on B
    #
    # Production would then be running a branch while `main` holds the newer tree, and nothing
    # would say so. It takes a deliberate act by someone with write access, which is why this is
    # hardening rather than a defect, and the guard costs one line. It stops C deploying. It does
    # NOT stop C displacing B (10 Nov 2026 review): the run joins the queue before this condition
    # is read, so B still never deploys and production stays on A. The `not-main` job below makes
    # such a run fail and say so. Keeping branch runs out of the queue altogether would key the
    # group on the ref, which the concurrency comment above decides against.
    #
    # If deploying a non-main ref is ever genuinely needed (a rollback to a tag, say), add an
    # explicit input and widen this condition to name it. Do not simply delete the check. The gate
    # jobs above carry the same condition, so a branch run spends no time testing either.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.safari.result == 'success' && ((needs.tested.result == 'success' && needs.tested.outputs.tested == 'true') || (needs.check.result == 'success' && needs.smoke.result == 'success' && needs.csp.result == 'success' && needs.signed-in.result == 'success')) }}
    # The image it has always deployed from. Nothing in this job starts a browser any more, so the pin
    # is kept for continuity rather than for the visual baselines; moving it is a change of its own.
    runs-on: ubuntu-24.04
    # 20 (10 Nov 2026). The tests run in the jobs above now, and what is left here took about a minute
    # on v25.69. The bound is the live check below at its worst — six looks of up to a minute each,
    # the pauses between them and two more reads, about eight minutes — with room for a slow `npm ci`.
    # This job's limit while it still ran the tests went 20 → 40 → 80; `smoke` has that history.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read     # the re-run check below lists this workflow's runs
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    steps:
      # No token left on disk for the job's lifetime (whole-app review, 10 Nov 2026): nothing here
      # needs git credentials — the upload check only lists files — and firebase-tools, a dependency,
      # runs in this job. The mirror's deploy job does the same.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A RE-RUN MUST NOT PUT AN OLDER TREE LIVE (whole-app review, 10 Nov 2026). A re-run deploys
      # the commit this run first ran on; once a newer run of this workflow exists, that may be older
      # than what is live, so this stops it before anything is installed or signed in. The action's
      # header has the account. A first attempt passes straight through. A re-run's gate jobs run
      # before this is reached, so a refused re-run still costs their time; never a deploy.
      - name: A re-run deploys only if no newer run has overtaken it
        uses: ./.github/actions/refuse-overtaken-rerun

      # firebase-tools and the upload check below come from the lockfile: without this, `npx firebase`
      # would fetch whatever version is newest on the day.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # NO INSTALL SCRIPT RUNS IN THIS JOB: it can mint a Google credential (the comment at the top of
      # `jobs:` says why; deploy-functions.yml records what was measured).
      - name: Install the deploy tool (no install scripts)
        run: npm ci --ignore-scripts

      # ── THE DEPLOY TOOL'S NODE ──────────────────────────────────────────────────────────────
      # Everything from here on is firebase-tools. Node 24 since v25.30 (22 from 3 Nov 2026); it was
      # held on 20 for its sign-in (deploy-functions.yml records why, and why that reason no longer
      # held). Kept as its own step so that going back to 22, if a deploy ever fails to authenticate,
      # is one line.
      - name: Deploy-tool Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account; the action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which the Firebase CLI picks up automatically. Migrated after deploy-rules.yml
      # proved WIF in production. See RECOVERY_RUNBOOK.md → "The deploy identity".
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      # NOTHING BUT THE COMMITTED APP IS UPLOADED (10 Nov 2026). Hosting's public directory is this
      # folder, and the sign-in step above has just written its credentials file into it; the
      # checkout's `.git/` is here too. Both are in firebase.json's ignore list — and this asks
      # firebase-tools' own lister what the deploy is about to upload and stops it if anything git
      # does not track is on the list. It must stay BETWEEN the sign-in and the deploy: before the
      # sign-in the credentials file does not exist yet, so a pass would prove nothing about it.
      # scripts/hosting-upload-check.mjs has the account; hosting-ignore-parity.test.mjs pins the order.
      - name: Check what Hosting is about to upload
        run: node scripts/hosting-upload-check.mjs

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --project myb-roster

      # Post-deploy live-URL health check. The pre-deploy smoke/CSP gates run against a local
      # server / emulator, NOT the live site with its real CSP header + API-key referrer allowlist,
      # so a live-only breakage (missing referrer domain, bad firebase.json header, Hosting hiccup)
      # would otherwise ship green and stay invisible — the app is offline-first, so every already-
      # installed phone keeps loading from cache while a fresh visitor gets a dead site. This is the
      # exact outage that once went unnoticed (Firebase stuck on splash + Pages 404). Fetches the
      # LIVE origin and asserts it serves the just-deployed APP_VERSION, not just any 200.
      - name: Verify live site (post-deploy health check)
        run: |
          set -uo pipefail
          VERSION=$(grep -oE "APP_VERSION = '[^']+'" roster-data.js | grep -oE "[0-9]+\.[0-9]+")
          echo "Expecting APP_VERSION $VERSION live on myb-roster.web.app"
          ok=false
          # Every read is limited to 30s (10 Nov 2026): an origin that accepts the connection and
          # never answers otherwise holds this step until the whole job runs out of time.
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 30 -o /tmp/root.html -w '%{http_code}' https://myb-roster.web.app/ || echo 000)
            curl -sS --max-time 30 -o /tmp/rd.js https://myb-roster.web.app/roster-data.js || true
            # grep the downloaded FILES (not a `printf "$live" | grep -q` pipe): under `set -o pipefail`,
            # grep -q exits on first match and closes the pipe, so printf takes SIGPIPE (141) once the
            # file exceeds the ~64KB pipe buffer, and pipefail reports the whole pipeline as FAILED — a
            # false negative that fired on the real deploy EXACTLY when the version DID match (the check
            # was only ever "green" when the site was actually stale/broken). File greps have no pipe.
            if [ "$code" = "200" ] && grep -q "Marylebone Roster" /tmp/root.html && grep -q "APP_VERSION = '$VERSION'" /tmp/rd.js; then
              ok=true; break
            fi
            echo "Attempt $i: http=$code, v$VERSION not yet live — retrying in 10s"; sleep 10
          done
          if [ "$ok" != true ]; then
            echo "::error::Live health check FAILED — myb-roster.web.app did not serve v$VERSION (root+roster-data.js)."
            exit 1
          fi
          echo "OK: myb-roster.web.app serving v$VERSION"
          # A deep-link (not just root) must also load — the documented Pages-404 class hit sub-pages.
          sub=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://myb-roster.web.app/paycalc.html || echo 000)
          if [ "$sub" != "200" ]; then echo "::error::paycalc.html returned $sub"; exit 1; fi
          echo "OK: paycalc.html deep-link 200"
          # GitHub Pages staff mirror: liveness only. Since 10 Nov 2026 it is published by
          # deploy-mirror.yml AFTER this run has finished, from the commit it released, so here it is
          # still on the previous release and a version match would always fail. deploy-mirror.yml
          # checks the version itself once it has published. Warn only.
          mcode=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://garethdavidmiller.github.io/roster-app/ || echo 000)
          if [ "$mcode" = "200" ]; then echo "OK: Pages mirror live (200)"; else echo "::warning::Pages mirror returned $mcode — check the mirror build"; fi

  # ── A RUN FROM ANOTHER BRANCH DEPLOYS NOTHING, AND SAYS SO (whole-app review, 10 Nov 2026) ───
  # The deploy job runs only from main, but this run joined the queue before that was read, and the
  # queue keeps one waiting run: a main deploy that was waiting has been replaced by this one, and
  # will not go out by itself. A run that deployed nothing and went green would hide that.
  not-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Deploys run only from main
        run: |
          echo "::error title=Nothing was deployed::This workflow deploys only from main, and this run was started on $GITHUB_REF_NAME. If a deploy from main was waiting when it started, this run took its place in the queue and that release has not gone out. To deploy main: Actions tab, \"$GITHUB_WORKFLOW\", Run workflow, on main."
          exit 1

  # ── AND A FAILURE BEFORE THE FIRST STEP MUST NOT BE SILENT EITHER ───────────────────────────
  #
  # The reporter used to be the deploy job's own last step, guarded by `if: failure()`, and its
  # comment claimed that covered "EVERY step above". True, and not the whole surface: a step-level
  # guard cannot run when NO step runs. On 14 Aug 2026 this workflow failed in `Prepare all
  # required actions` — codeload would not serve the pinned `actions/setup-java` — so the job died
  # during setup, every step including the reporter was skipped, and the deploy failed in exactly
  # the silence the reporter exists to prevent. It was found by hand, days later.
  #
  # A SEPARATE JOB closes that: `needs` + a job-level `if: failure()` fires when the deploy job
  # fails for ANY reason, setup included. It REPLACES the in-job step rather than joining it —
  # two reporters on one failure would comment twice on the same issue, and a notification
  # channel that repeats itself is one people stop reading.
  #
  # The irreducible tail: this job needs `checkout` and the action itself, so a codeload outage
  # broad enough to take those down takes the reporter with it. Nothing inside a workflow can
  # report that. It is a far smaller target than the four actions the deploy job pulls.
  #
  # …NOR A DEPLOY THAT RUNS OUT OF TIME (whole-app review, 10 Nov 2026). A job that reaches its
  # timeout-minutes ends CANCELLED, not failed, and `failure()` alone skipped this job for it: the
  # v24.44 deploy cut off at 20m00s on 2 Oct 2026 told nobody, and only the hourly currency check
  # noticed. So it also runs when the job it waits for was cancelled, and the notice says the
  # deploy may have stopped part-way.
  #
  # …AND IT WAITS FOR EVERY GATE JOB, NOT ONLY `deploy` (10 Nov 2026). The tests have their own jobs
  # now (the comment at the top of `jobs:`). A gate job that runs out of time ends cancelled and
  # leaves `deploy` skipped, and neither `failure()` nor a cancelled check of `deploy` alone sees
  # that, so this lists them all. The notice says "cut off part-way" only when `deploy` itself was
  # cancelled: a gate job cut off means nothing was uploaded, which is the plain "did not deploy".
  report-failure:
    needs: [tested, check, smoke, csp, signed-in, safari, deploy]
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report-deploy-failure
        with:
          target: 'Firebase Hosting'
          token: ${{ github.token }}
          result: ${{ needs.deploy.result == 'cancelled' && 'cancelled' || 'failure' }}
