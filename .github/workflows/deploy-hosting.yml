name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'functions/**'
      - 'firestore.rules'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check and unit tests
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          # Canonical check command (lint + tests) lives in package.json.
          npm run check

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/key.json

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project myb-roster
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
