name: Deploy GitHub Pages mirror

# ── THE MIRROR GOES OUT ONLY AFTER THE HOSTING GATE HAS PASSED (whole-app review, Oct 2026) ──────
#
# Most staff open the app on the GitHub Pages mirror (ARCHITECTURE.md, EXC-006). It was published
# by GitHub's own "pages build and deployment", straight from main, with no test of any kind — so on
# 24 Oct 2026 v24.94 failed the Firebase Hosting gate while the mirror shipped it, and for about
# three hours most staff ran a release the gate had refused.
#
# This publishes the mirror from the commit a SUCCESSFUL "Deploy Firebase Hosting" run released,
# and from nothing else. A manual run publishes the last commit Hosting released from main — never
# main's tip, which may be a tree the gate refused — and so does a re-run. "Released" is checked by
# who started the run, not by what it was called: the plan job below says why.
#
# IT IS LIVE: the owner switched Settings → Pages → Source to "GitHub Actions" on 10 November 2026,
# and it first published the mirror at 14:18 that day. The first job still reads that setting and
# stands down if Pages is ever switched back to building from the branch: a workflow deploy against
# a branch-built site fails, and announcing that as a failed deploy would be crying wolf on the
# issue thread the real failures use. The switch: OPERATIONS_REFERENCE.md → "The Pages mirror".
#
# WHAT IT PUBLISHES IS WHAT THE BRANCH BUILD PUBLISHED — the committed tree at that commit (`git
# archive`), less dot-files, which the app never loads. The same files, now behind the gate.
# Narrowing it to the Hosting bundle (firebase.json's ignore list) would also stop the mirror
# serving the test files, and is a separate decision.

on:
  workflow_run:
    workflows: ['Deploy Firebase Hosting']
    types: [completed]
  workflow_dispatch:

# One at a time, in order, never cancelled mid-flight — the same rule and the same reasons as the
# three deploy workflows (deploy-hosting.yml has the account). Hosting runs queue, so the runs that
# trigger this one complete in order, and this queue keeps that order on the way out.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # WHICH COMMIT, AND WHETHER PAGES WILL TAKE A WORKFLOW DEPLOY AT ALL. A separate job so the deploy
  # job, which must name the github-pages environment, never starts when there is nothing to do: an
  # environment on a job records a deployment whether or not a step publishes anything.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      go: ${{ steps.plan.outputs.go }}
    steps:
      # ── WHO STARTED THE HOSTING RUN, NOT WHAT IT WAS CALLED (whole-app review, 10 Nov 2026) ───
      #
      # `workflow_run` matches the run it waits for by NAME, and a pull request from a fork runs
      # the fork's own copy of the workflow files. So anybody can fork this public repository,
      # give a one-step workflow the name "Deploy Firebase Hosting", call their branch `main` and
      # open a pull request: GitHub runs it here, it ends `success`, its branch reads `main` and
      # its commit is THEIRS. A name, a branch and a conclusion say nothing about where a commit
      # came from. Who started the run does: a release is a push to this repository's main or a
      # run started here by hand, and nobody outside the repository can start either. So the run
      # must have one of those two events and this repository as its head, a manual run asks the
      # API for each event separately (pull-request runs cannot then fill its one-run page), and
      # nothing is published unless main already contains the commit. Repositories are compared
      # by id, which no fork can share and a rename does not change.
      #
      # A RE-RUN PUBLISHES THE NEWEST RELEASE, as a manual run does: re-running a run replays the
      # release it was first given, which may have been overtaken since, and publishing that would
      # put the mirror — the origin most staff open — back on an older version.
      #
      # workflow-hygiene.test.mjs runs this script against each case, with `gh` stubbed.
      - name: Decide what to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          REPO_ID: ${{ github.repository_id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO_ID: ${{ github.event.workflow_run.head_repository.id }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          stand_down() { echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Sets RELEASE to the commit of Hosting's newest successful run on main from each event, the
          # later of the two, and RELEASE_FROM to the id of the repository it came from — or both to
          # nothing. Called directly, never inside $( ), so that a failed read stops the script.
          newest_release() {
            local ev line n s from best=0
            RELEASE=""
            RELEASE_FROM=""
            for ev in push workflow_dispatch; do
              line=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-hosting.yml/runs?branch=main&event=$ev&status=success&per_page=1" \
                --jq '.workflow_runs[0] // empty | "\(.run_number) \(.head_sha) \(.head_repository.id)"')
              read -r n s from <<< "$line"
              if [ -n "$s" ] && [ "$n" -gt "$best" ]; then
                best="$n"
                RELEASE="$s"
                RELEASE_FROM="$from"
              fi
            done
          }

          if [ "$EVENT" = "workflow_run" ] && [ "$ATTEMPT" = "1" ]; then
            if [ "$RUN_CONCLUSION" != "success" ] || [ "$RUN_BRANCH" != "main" ]; then
              echo "The Hosting run did not release main ($RUN_CONCLUSION on $RUN_BRANCH), so there is nothing to publish."
              stand_down
            fi
            if { [ "$RUN_EVENT" != "push" ] && [ "$RUN_EVENT" != "workflow_dispatch" ]; } || [ "$RUN_REPO_ID" != "$REPO_ID" ]; then
              echo "::warning::A run named \"Deploy Firebase Hosting\" finished on a branch called main, but it was started by a $RUN_EVENT event in $RUN_REPO. Only a push to this repository's main, or a run started here by hand, is a release, so nothing is published."
              stand_down
            fi
            sha="$RUN_SHA"
          else
            newest_release
            sha="$RELEASE"
            if [ -z "$sha" ]; then
              echo "::error::There is no successful Hosting release on main to publish."
              exit 1
            fi
            # Push and hand-started runs can only come from here, so this never fires while GitHub
            # behaves as documented. If it ever does, stop: falling back to an older release would
            # put the mirror behind Hosting without a word.
            if [ "$RELEASE_FROM" != "$REPO_ID" ]; then
              echo "::error::Hosting's newest release on main did not come from this repository, so the mirror will not publish it."
              exit 1
            fi
          fi

          # A COMMIT, AND ONLY A COMMIT: the checkout below would take a branch name just as happily.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release to publish is not named by a full commit SHA, so the mirror will not publish it."
            exit 1
          fi

          # An unreadable answer FAILS (and is reported), rather than standing down: a gate that
          # quietly skipped every release would look exactly like one standing down for a branch build.
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$build_type" != "workflow" ]; then
            echo "::notice::Pages builds from the branch (build_type=$build_type), so the mirror is not behind the Hosting gate. Set Settings → Pages → Source to GitHub Actions."
            stand_down
          fi

          # AND A COMMIT THIS REPOSITORY'S main ALREADY HOLDS. GitHub's comparison says where main
          # stands from the commit: `identical` (the commit is main's tip) or `ahead` (main has moved
          # on past it). `behind` or `diverged` means main does not contain it — a commit from
          # somewhere else, or a main that has been rewritten.
          where=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main?per_page=1" --jq '.status')
          case "$where" in
            identical|ahead) ;;
            *)
              echo "::error::Commit $sha is not on this repository's main (main is '$where' from it), so the mirror will not publish it."
              exit 1
              ;;
          esac

          echo "Publishing $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write   # deploy-pages proves the run to the Pages service with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Lay out the committed tree
        run: |
          set -euo pipefail
          mkdir _site
          git archive --format=tar HEAD | tar -x -C _site

      # The mirror is where most staff are, so a file missing from it is a broken app for most staff.
      # Every path the service worker precaches must be in the artifact — the same five lists, and
      # the same reading of them, as sw-asset-check.test.mjs's ghost-entry check.
      - name: Every precached file is in the site
        run: |
          set -euo pipefail
          node - <<'EOF'
          const { readFileSync, existsSync } = require('node:fs');
          const sw = readFileSync('_site/service-worker.js', 'utf8');
          const missing = [];
          let seen = 0;
          for (const name of ['NETWORK_FIRST_FILES', 'CORE_ASSETS', 'SUPPLEMENTARY_ASSETS', 'FONT_ASSETS', 'ICON_ASSETS']) {
            const body = (sw.match(new RegExp(`const ${name}\\s*=\\s*\\[([\\s\\S]*?)\\];`)) || [])[1] || '';
            for (const m of body.matchAll(/['"]([^'"]+)['"]/g)) {
              if (m[1].startsWith('http')) continue;
              seen++;
              if (!existsSync('_site/' + m[1].replace(/^\.\//, ''))) missing.push(`${name}: ${m[1]}`);
            }
          }
          if (seen < 20) { console.error(`::error::Read only ${seen} precached paths — the lists have stopped parsing.`); process.exit(1); }
          if (missing.length) { console.error('::error::Precached files missing from the site:\n  ' + missing.join('\n  ')); process.exit(1); }
          console.log(`All ${seen} precached paths are in the site.`);
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The same proof the Hosting deploy asks of its own origin: the LIVE mirror serves the version
      # just published. The query string defeats the CDN's ten-minute cache, so a pass is the origin.
      - name: Verify the mirror serves this release
        run: |
          set -uo pipefail
          VERSION=$(grep -oE "APP_VERSION = '[^']+'" _site/roster-data.js | grep -oE "[0-9]+\.[0-9]+")
          echo "Expecting APP_VERSION $VERSION on the Pages mirror"
          for i in $(seq 1 12); do
            curl -sS --max-time 30 -o /tmp/rd.js "https://garethdavidmiller.github.io/roster-app/roster-data.js?release=$GITHUB_RUN_ID-$i" || true
            if grep -q "APP_VERSION = '$VERSION'" /tmp/rd.js; then
              echo "OK: the Pages mirror is serving v$VERSION"
              exit 0
            fi
            echo "Attempt $i: v$VERSION not live yet, retrying in 10s"
            sleep 10
          done
          echo "::error::The Pages mirror did not serve v$VERSION within two minutes of the deploy."
          exit 1

  # A RUN FROM ANOTHER BRANCH PUBLISHES NOTHING, AND SAYS SO (whole-app review, 10 Nov 2026). The
  # plan runs only from main, but this run joined the queue first and may have replaced a waiting
  # one; deploy-hosting.yml has the account.
  not-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The mirror publishes only from main
        run: |
          echo "::error title=Nothing was published::This workflow publishes only from main, and this run was started on $GITHUB_REF_NAME. If a run from main was waiting when it started, this run took its place in the queue and that release has not reached the mirror. To publish it: Actions tab, \"$GITHUB_WORKFLOW\", Run workflow, on main."
          exit 1

  # A failure anywhere above — the plan, the layout check, the deploy or the live proof — opens or
  # updates the same deploy-failure issue the other deploys use. Its own job, for the reason
  # deploy-hosting.yml gives: a step-level reporter cannot run when the job died in setup. And it
  # runs when a job was cancelled, which is how one that ran out of time ends (deploy-hosting.yml).
  #
  # IT NAMES THE RELEASE THE PLAN CHOSE (whole-app review, 10 Nov 2026). This run's own commit is
  # main's tip, which is often a merge Hosting has not released yet; the notice used to name that,
  # and its version, as the commit that "did not go out". So it waits for the plan too, and passes
  # on what the plan chose — `none` when the plan stopped before choosing.
  report-failure:
    needs: [plan, deploy]
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report-deploy-failure
        with:
          target: 'GitHub Pages mirror'
          token: ${{ github.token }}
          result: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure' }}
          sha: ${{ needs.plan.outputs.sha || 'none' }}
