name: Did the wrong test run win?

# ── WHY THIS EXISTS (9 Sep 2026) ───────────────────────────────────────────────────────────────
#
# `e2e.yml` files the `push` and `pull_request` events into ONE concurrency group so a branch
# carries one suite rather than two. The survivor SHOULD be the `pull_request` run, which checks
# out the synthetic merge commit — what merging would actually produce — where the `push` run only
# tests the branch head. When `main` has moved under an open PR those are different trees.
#
# But the group does not encode that preference. Whichever event fires LATER wins. That is
# ordinarily the PR run, and a sweep of 63 runs over 38 commits found zero exceptions — and then
# the very next pull request produced one: #1431, where the PR run started 11:49:42 and was
# cancelled while the push run for the same commit started 11:53:30 and survived. A force-push
# after a rebase is evaluated over the whole pushed range and scheduled well behind the PR event,
# so the gap was 228 SECONDS, not the "seconds" e2e.yml's comment assumes.
#
# THE POINT OF THIS WORKFLOW IS NOT TO FIX THAT. Fixing it means restructuring the CI graph — nine
# jobs hang off the `guard` job that exists only to filter push events — and the failure mode of a
# botched trigger change is a silently SKIPPED suite on a branch somebody is about to merge, which
# is worse than the thing being fixed. The race costs a stale-base pass, and the deploy workflow's
# own gate is the net.
#
# What was missing is that nobody KNOWS when it happens. The one observed instance was caught only
# because somebody happened to be watching a run list. So: make it loud before making it different
# — the same order the visual lane was fixed in. This counts, it does not act.
#
# It reports into ONE deduped issue rather than one per occurrence, because a run of these is one
# situation and N issues is noise. The count IS the deliverable: DECISIONS.md records this race as
# an OPEN question, and how often it actually happens is what decides whether the restructure earns
# its risk.

on:
  schedule:
    # Hourly, offset off the top of the hour so it does not queue behind everything else that runs
    # at :00. An hour is fine: nothing here is urgent, and the output is evidence, not an alarm.
    - cron: '43 * * * *'
  workflow_dispatch:

# Least privilege: read the repo, write the one issue. It observes and reports; it never re-runs a
# workflow, never pushes, and never touches a deploy.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find commits where the branch-head run beat the merge-result run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # gh's issue and label commands find their repository from a git checkout, and this job has
          # none. Until 10 Nov 2026 every one of them failed "not a git repository", the warning was
          # printed, and the run went green: no issue could ever appear, which reads exactly like
          # "no races". Named here, they need no checkout.
          export GH_REPO="$REPO"
          LABEL="ci-race"

          # One page of recent `Tests` runs. 100 covers well over a day at this repo's rate.
          if ! gh api "repos/$REPO/actions/runs?per_page=100" > runs.json 2>err.txt; then
            # FAIL LOUD, NOT SILENT. A detector that dies quietly reports "no races" forever, which
            # is indistinguishable from a healthy repo — precisely the defect it was built to end.
            echo "::warning::could not read workflow runs: $(head -c 300 err.txt)"
            exit 0
          fi

          # WHAT THE OPEN ISSUE ALREADY RECORDS, so an instance is reported once — not again every
          # hour for as long as it stays among the last 100 runs. An unreadable issue leaves this
          # empty, which can repeat an instance but never hides a new one.
          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 1 --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          : > known.txt
          if [ -n "$EXISTING" ]; then
            gh issue view "$EXISTING" --json body,comments --jq '.body, .comments[].body' > known.txt 2>/dev/null || true
          fi

          python3 - <<'PY' > found.txt
          import json, collections, os

          known = open('known.txt').read()
          runs = [r for r in json.load(open('runs.json')).get('workflow_runs', [])
                  if r.get('name') == 'Tests']
          by_sha = collections.defaultdict(list)
          for r in runs:
              by_sha[r['head_sha']].append(r)

          out = []
          for sha, rs in by_sha.items():
              pr   = [r for r in rs if r['event'] == 'pull_request']
              push = [r for r in rs if r['event'] == 'push']
              # The wrong-way race, stated exactly: for ONE commit, the merge-result run was
              # cancelled, no merge-result run for that commit completed, and a branch-head run was
              # queued after it. The last two clauses are what separate this from ordinary
              # supersession — a newer push to the same PR also cancels a PR run, and that is
              # correct behaviour, not a race.
              pr_cancelled = [r for r in pr if r['conclusion'] == 'cancelled']
              pr_settled   = [r for r in pr if r['conclusion'] in ('success', 'failure')]

              # THE RACE IS "the merge-result evidence was destroyed", and nothing more. A PR run
              # cancelled while ANOTHER PR run for the same commit completed is ordinary
              # supersession — a newer push to the same PR — and is correct behaviour, so it is not
              # counted.
              if not (pr_cancelled and not pr_settled):
                  continue

              # AND THE PUSH RUN WAS QUEUED SECOND (10 Nov 2026 review). The group cancels whichever
              # run was queued FIRST, so the race is a push run queued AFTER the merge-result run it
              # cancelled. A push run queued BEFORE it is the designed order — the merge-result run
              # cancelled it — and when the next push to the same branch then cancels that one too,
              # nothing raced: it is a commit superseded by a newer one. Counted, every double push
              # read as a "superseded" race, and the count is the evidence this exists to produce.
              first_pr = min(r.get('created_at') or '' for r in pr_cancelled)
              late = [r for r in push if (r.get('created_at') or '') > first_pr]
              if not late:
                  continue
              if f"`{sha[:9]}`" in known:
                  continue
              late_settled = [r for r in late if r['conclusion'] in ('success', 'failure')]

              # Then say which KIND, because they are not equally serious and lumping them together
              # would inflate the case for a risky change:
              #
              #   consequential — a branch-head run survived, so a PR could be merged on evidence
              #                   that never saw the merge result.
              #   superseded    — nothing completed for this commit either, because the push run was
              #                   itself killed by a later push. The mechanism fired; nobody was hurt.
              #
              # The first cut of this workflow required a settled push run and so reported ONLY the
              # first kind. Run against the day the race was discovered, it found NOTHING — both
              # real instances were the second kind. A detector that answers "no races" on the day
              # of two races is the exact silence it was built to end, so it now reports both.
              w = (late_settled or late)[0]
              out.append({
                  'sha': sha[:9],
                  'branch': w.get('head_branch') or '?',
                  'kind': 'consequential' if late_settled else 'superseded',
                  'pr_started': pr_cancelled[0]['run_started_at'],
                  'push_started': w.get('run_started_at') or '—',
                  'push_conclusion': w.get('conclusion') or 'none',
                  'url': w['html_url'],
              })

          for o in sorted(out, key=lambda o: o['push_started']):
              note = ('branch-head run %s — a merge here would rest on it'
                      % o['push_conclusion']) if o['kind'] == 'consequential' else \
                     'branch-head run also cancelled — no run completed for this commit'
              print(f"- **{o['kind']}** · `{o['sha']}` on `{o['branch']}` — merge-result run "
                    f"cancelled ({o['pr_started']}); {note} ({o['push_started']}) "
                    f"· [run]({o['url']})")
          PY

          if [ ! -s found.txt ]; then
            echo "No new wrong-way races in the last 100 Tests runs."
            exit 0
          fi

          echo "::warning::the branch-head run beat the merge-result run — see the tracking issue"
          cat found.txt

          BODY=$(printf '%s\n' \
            "The \`push\` run (branch head) outlived the \`pull_request\` run (synthetic merge commit) for the same commit." \
            "" \
            "$(cat found.txt)" \
            "" \
            "**What this means.** The surviving run tested the branch head, not what merging would produce. If \`main\` moved while the PR was open, the merged combination was never run on a branch. The deploy workflow's own gate on \`main\` is the net, so this is a weaker check rather than no check." \
            "" \
            "**What it is FOR.** \`docs/DECISIONS.md\` records this race as an OPEN question — the design (one suite per branch) is right, the preference between the two events is a race rather than a rule. How often this fires is the evidence that decides whether restructuring the CI graph earns its risk. Nine jobs depend on the \`guard\` job that exists only to filter push events, and a botched trigger change fails by silently SKIPPING a suite, which is worse than what it fixes." \
            "" \
            "Detected by \`.github/workflows/race-detector.yml\`. Comments accumulate on this one issue on purpose: a run of these is one situation." )

          # The label must exist before an issue can carry it; creating it again is a no-op.
          gh label create "$LABEL" --color FBCA04 \
            --description "A branch-head test run outlived its merge-result run" 2>/dev/null || true

          # An instance that cannot be filed FAILS the run. The issue is the deliverable, and a
          # warning on a green hourly run is read by nobody — the silence this replaced.
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" \
              || { echo "::error::could not comment on issue #${EXISTING}; the instances above are recorded only in this log"; exit 1; }
          else
            gh issue create --title "CI: the branch-head run beat the merge-result run" \
              --label "$LABEL" --body "$BODY" \
              || { echo "::error::could not create the tracking issue; the instances above are recorded only in this log"; exit 1; }
          fi
