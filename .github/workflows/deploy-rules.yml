name: Deploy Firestore and Storage Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC → Workload Identity Federation (A2)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # firebase-tools v15 requires Java 21+ to run the Firestore/Storage emulators
      # used by `npm run test:rules` (the safety gate below). The ubuntu-latest default
      # JDK is older than 21, so without this the gate crashes with
      # "firebase-tools no longer supports Java version before 21" before any rules deploy.
      - name: Install Java 21 (Firebase emulators)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Gate: the canonical repo quality gate (lint + typecheck + unit tests) must
      # pass before rules ship. Without this the Rules workflow could deploy while
      # the repository gate is red or the client/rules contract has drifted — the
      # v14.11 review showed a spare_shift/correction rule-vs-app mismatch that this
      # separation would have let ship independently of the blocked app deploy.
      - name: Run canonical quality gate
        run: npm run check

      # Gate: Firestore + Storage security rules tests must pass before any rules ship.
      # firebase emulators:exec downloads the emulator binaries on first run
      # (cached in ~/.cache/firebase/emulators between runs).
      - name: Run Firestore and Storage rules tests
        run: npm run test:rules

      # Authenticate to Google Cloud via Workload Identity Federation — no long-lived key.
      # GitHub's per-run OIDC token is exchanged for short-lived credentials for the
      # github-deploy service account. The action writes an external_account credential
      # file and exports GOOGLE_APPLICATION_CREDENTIALS, which the Firebase CLI picks up
      # automatically — so the deploy steps below need no explicit credential wiring.
      # This was the CANARY workflow that proved WIF first; deploy-hosting.yml and
      # deploy-functions.yml now authenticate the same way. The FIREBASE_SERVICE_ACCOUNT
      # secret is retired — no deploy workflow references a key file any more.
      # Full plan + cutover sequence: SECURITY_RELEASE_PLAN.md → Appendix A2.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/532910998075/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@myb-roster.iam.gserviceaccount.com'

      - name: Deploy Firestore rules and indexes
        run: |
          npx firebase deploy --only firestore:rules,firestore:indexes --project myb-roster

      - name: Deploy Storage rules
        # Separate step so a Storage permission error does not prevent Firestore rules from deploying.
        # If this step fails, check that the github-deploy service account has the
        # Firebase Rules Admin role (roles/firebaserules.admin) for project myb-roster.
        run: |
          npx firebase deploy --only storage --project myb-roster
