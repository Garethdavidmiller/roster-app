name: Deploy Firestore and Storage Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/key.json

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project myb-roster
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json

      - name: Deploy Storage rules
        # Separate step so a Storage permission error does not prevent Firestore rules from deploying.
        # If this step fails, check that FIREBASE_SERVICE_ACCOUNT has the Storage Admin role
        # (roles/storage.admin) in the Google Cloud Console for project myb-roster.
        run: |
          firebase deploy --only storage --project myb-roster
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
